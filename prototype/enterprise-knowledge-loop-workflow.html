/* v2.1: 처리 경로·단일 진행 표시 */
.stagebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
.stage{padding:13px 16px;border-right:1px solid var(--line);min-width:0}.stage:last-child{border-right:0}
.stage small{display:block;font-size:11px;color:var(--muted)}.stage strong{display:block;margin:3px 0}.stage span{display:block;font-size:12px;color:var(--muted)}
.stage.done strong{color:var(--deep)}.stage.now{background:var(--soft);box-shadow:inset 0 3px var(--green)}.stage.now strong{color:var(--deep)}
.track-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.track-card{border:1px solid var(--line);background:#fff;border-radius:8px;padding:15px 16px;text-align:left;min-width:0}
.track-card strong{display:block;font-size:25px;line-height:1.5;margin-top:6px}.track-card strong span{font-size:12px;font-weight:400}.track-card p{font-size:12px}
.candidate{margin-bottom:18px;border-color:#dccff0}
.voice-layout{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.6fr);gap:20px;align-items:start}
.voice-row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:14px 18px}.voice-row:last-child{border-bottom:0}
.voice-row strong{display:block;margin:3px 0 6px}.voice-row.active{background:var(--soft);box-shadow:inset 3px 0 var(--green)}
.voice-layout blockquote{margin:14px 0;border-left:3px solid #cfd9dd;padding:12px 15px;background:#f5f7f8}
.track-pick{border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin:15px 0;display:flex;gap:8px;flex-wrap:wrap}
.track-pick legend{font-size:12px;font-weight:700;padding:0 4px}
.track-pick label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:13px;cursor:pointer}
.track-pick label.on{border-color:#7fafcf;background:var(--soft);color:var(--deep);font-weight:700}.track-pick small{font-size:10px;color:var(--purple)}

dialog.wide{max-width:880px}

/* 접수 대기열 */

.pf-line-steps li.rejected{border-color:#e5b4b4;background:#fdf3f3}
.pf-line-act{padding-top:10px;border-top:1px solid var(--line)}
.pf-inbox{margin-bottom:18px}
.pf-inbox-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.pf-inbox-row:last-child{border-bottom:0}
.pf-inbox-row>div{flex:1;min-width:0}
.btn.danger{color:#b42318;border-color:#e5b4b4}
.pf-line-steps li.excluded{background:#f6f7f8;border-style:dashed}
.pf-line-steps li.excluded b{text-decoration:line-through;color:var(--muted)}
.pf-line-steps li .pf-link{align-self:flex-start;margin-top:4px}
.pf-adj>b{display:block;font-size:13px;margin-bottom:8px}
.pf-adj-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pf-adj-row select{min-height:38px}
.pf-adj-row input{flex:1;min-width:200px;min-height:38px}
</style>
</head>
<body>
<div class="demo"><span><strong>DESIGN PREVIEW</strong> · 가상 데이터 / 서버 미연결</span><label>시안 역할 <select id="role" onchange="roleChange(this.value)" aria-label="시안 역할"></select></label></div>
<div class="shell"><aside><div class="brand"><span class="logo"><svg viewBox="4 18 112 76" width="58" height="40" aria-hidden="true" focusable="false"><defs><linearGradient id="g" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0369a1"/></linearGradient></defs><path d="M28,86 C14,86 8,74 12,64 C15,56 23,52 30,54 C30,38 44,26 60,28 C72,29 80,36 83,45 C96,43 108,52 107,66 C106,78 97,86 86,86 Z" fill="url(#g)"/><g stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round"><path d="M68.63,41.07 A19,19 0 0 1 78.97,58.99"/><path d="M70.35,73.93 A19,19 0 0 1 49.65,73.93"/><path d="M41.03,58.99 A19,19 0 0 1 51.37,41.07"/></g><g fill="#ffffff"><path d="M78.86,61.19 L75.54,55.81 L82.73,56.19 Z"/><path d="M47.81,72.74 L54.13,72.55 L50.21,78.59 Z"/><path d="M53.33,40.07 L50.34,45.64 L47.07,39.23 Z"/></g><circle cx="60.00" cy="39.00" r="8.6" fill="#ffffff"/><circle cx="76.45" cy="67.50" r="8.6" fill="#ffffff"/><circle cx="43.55" cy="67.50" r="8.6" fill="#ffffff"/><path d="M57.8,41.2 a4,4 0 1 1 4.4,0 v1.6 h-4.4 z" fill="none" stroke="#0369a1" stroke-width="1.3" stroke-linejoin="round"/><path d="M58.4,44.1 h3.2" stroke="#0369a1" stroke-width="1.2" stroke-linecap="round"/><path d="M72.85448267190435,62.9 h4.6 l2.6,2.6 v6.6 h-7.2 z" fill="none" stroke="#0369a1" stroke-width="1.3" stroke-linejoin="round"/><path d="M74.65448267190435,67.7 h3.6 M74.65448267190435,69.9 h3.6" stroke="#0369a1" stroke-width="1.1" stroke-linecap="round"/><text x="43.54551732809566" y="70.6" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="8.4" fill="#0369a1">AI</text></svg></span><div><small class="brand-ent">ENTERPRISE</small>Knowledge<br>Loop<small>AI WORKSPACE</small></div></div><nav id="nav" aria-label="주요 메뉴"></nav><div class="nav-foot"><strong>● Local intelligence</strong>기업의 기록을<br>기업 안에서 지식으로.<br><button class="btn text small" onclick="resetDemo()">시안 처음부터 보기</button></div></aside><div class="work"><header class="topbar"><span id="crumb" class="crumb"></span><select id="mobile-menu" class="mobile-menu" aria-label="화면 이동" onchange="go(this.value)"></select><div class="top-actions"><span class="tag green local">내부 AI 환경</span><div id="user-context"></div><span class="avatar" aria-hidden="true">K</span><button class="btn small" onclick="showLogin()">로그인 시안</button></div></header><main id="main" class="main"></main></div></div>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button class="close" onclick="document.getElementById('modal').close()" aria-label="닫기">×</button></div><div class="modal-body" id="modal-body"></div></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pages={home:['◉','지식 순환 현황','순환'],voice:['↙','접수된 VOC','업무'],case:['▤','부서 협업·해결','업무'],review:['◇','지식화 검토','지식'],distribution:['↗','부서 지식함','지식'],search:['⌕','문서·지식 질의(AI)','지식'],knowledge:['▥','지식·문서 자산','지식'],pipeline:['⇄','수집·처리 흐름','운영'],organization:['♧','조직·사용자 연동','운영'],acl:['⊞','권한·감사','운영'],quality:['▦','품질·운영','운영']};
const roles={handler:{name:'담당자 · 김도윤',dept:'고객지원팀',menus:['home','voice','case','review','distribution','search','knowledge','pipeline']},reviewer:{name:'검토·게시자 · 박서연',dept:'고객지원팀',menus:['home','voice','case','review','distribution','search','knowledge']},sourceowner:{name:'원본 소유자 · 이수현',dept:'고객지원팀',menus:['home','review']},policyofficer:{name:'정책 승인자 · 정하린',dept:'정보보호팀',menus:['home','review','acl']},viewer:{name:'일반 사용자 · 최지우',dept:'영업팀',menus:['home','search','knowledge','distribution']},concurrent:{name:'김도윤 · 겸직 열람',dept:'운영팀',menus:['home','search','knowledge','distribution']},admin:{name:'관리자 · 이준호',dept:'관리 조직',menus:['home','pipeline','organization','acl','quality']}};
const state={page:'home',role:'handler',tab:'source',decision:'',verified:false,draft:false,submitted:false,sourceApproved:false,policyApproved:false,approved:false,published:false,distributed:false,ack:false,reused:false,retired:false,query:'',searched:false,filter:'all',flow:'normal',node:0,synced:false,proposal:null};
const tag=(s,c='')=>`<span class="tag ${c}">${s}</span>`;
const btn=(s,action,kind='')=>`<button class="btn ${kind}" onclick="${action}">${s}</button>`;
const panel=(title,body,extra='')=>`<section class="panel"><div class="panel-head"><h2>${title}</h2>${extra}</div><div class="panel-body">${body}</div></section>`;
const head=(eyebrow,title,desc,action='')=>`<header class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${action}</div></header>`;
const canCase=()=>['handler','reviewer','sourceowner'].includes(state.role);
const canKnowledge=()=>['handler','reviewer','concurrent'].includes(state.role);
const activeKnowledge=()=>state.published&&!state.retired;
function go(page){if(!roles[state.role].menus.includes(page)){toast('현재 업무 소속에서 사용할 수 없는 메뉴입니다.');return}state.page=page;render();window.scrollTo(0,0)}
function roleChange(role){state.role=role;state.query='';state.searched=false;state.tab='source';if($('modal').open)$('modal').close();state.page=roles[role].menus.includes(state.page)?state.page:'home';render()}
function assignment(value){roleChange(value==='primary'?'handler':'concurrent');toast('업무 소속을 전환했습니다. 이전 검색 문맥은 초기화됩니다.')}
function toast(s){$('toast').textContent=s;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').textContent='',4000)}
function modal(title,body){$('modal-title').textContent=title;$('modal-body').innerHTML=body;$('modal').showModal()}
function resetDemo(){location.reload()}
function render(){const r=roles[state.role];$('nav').innerHTML=Object.keys(pages).filter(p=>r.menus.includes(p)).map((p,i,a)=>`${i===0||pages[a[i-1]][2]!==pages[p][2]?`<div class="nav-label">${pages[p][2]}</div>`:''}<button class="nav-btn ${p===state.page?'active':''}" onclick="go('${p}')" ${p===state.page?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${pages[p][0]}</span>${pages[p][1]}</button>`).join('');$('mobile-menu').innerHTML=r.menus.map(p=>`<option value="${p}" ${p===state.page?'selected':''}>${pages[p][1]}</option>`).join('');$('role').value=state.role;$('crumb').textContent=`워크스페이스 / ${pages[state.page][1]}`;$('user-context').innerHTML=`${['handler','concurrent'].includes(state.role)?`<label>업무 소속 <select id="assignment" onchange="assignment(this.value)"><option value="primary" ${state.role==='handler'?'selected':''}>1001 · 고객지원팀 본직</option><option value="concurrent" ${state.role==='concurrent'?'selected':''}>1001 · 운영팀 겸직 / 열람</option></select></label>`:`<span>${r.dept} · ${r.name.split(' · ')[1]}</span>`}`;$('main').innerHTML=({home:homePage,voice:voicePage,case:casePage,review:reviewPage,distribution:distributionPage,search:searchPage,knowledge:knowledgePage,pipeline:pipelinePage,organization:organizationPage,acl:aclPage,quality:qualityPage}[state.page])()+`<footer class="footer"><span>Knowledge Loop · 접수된 VOC를 다음 업무의 지식으로</span><span>시안 · 모든 기록·수치·AI 응답은 가상입니다</span></footer>`;}
function loopSteps(){return [['접수 기록 반입','voice',1],['부서 협업·해결','case',state.verified?0:1],['검증·지식화','review',state.draft&&!state.published?1:0],['게시·부서 배포','distribution',state.distributed?1:0],['업무 재사용','knowledge',state.reused?1:0],['다음 VOC 해결','search',state.reused?1:0]].map(([name,page,count],i)=>`<button class="${i===1?'current':''}" onclick="go('${page}')"><small>0${i+1}</small><strong>${count}<span> 건</span></strong><span>${name}</span></button>`).join('')}
function homePage(){if(state.role==='admin')return head('OPERATIONS','지식 순환을 안전하게 운영합니다','업무 본문 열람 권한과 운영 권한은 별도로 관리합니다.')+`<div class="stat-grid"><div class="stat"><small>등록된 가상 수집원</small><strong>1</strong></div><div class="stat"><small>조직 동기화</small><strong>${state.synced?'완료':'대기'}</strong></div><div class="stat"><small>정책 변경 제안</small><strong>${state.proposal?1:0}</strong></div></div><div class="grid equal">${panel('수집 → 정제 → 지식 순환','<p>수집 권한, 정제 실패와 처리 계보를 확인합니다. 본문은 운영 권한만으로 공개되지 않습니다.</p>'+btn('수집·처리 흐름 보기',"go('pipeline')",'primary'))}${panel('조직과 접근 권한','<p>사람·사번·발령을 분리하고, 선택된 업무 소속의 권한만 적용합니다.</p>'+btn('조직·사용자 확인',"go('organization')"))}</div>`;
 if(['sourceowner','policyofficer'].includes(state.role))return head('REVIEW WORKSPACE','지식의 내용과 공유 범위를 검토합니다','각 승인자는 현재 버전의 근거와 범위를 독립적으로 확인합니다.')+panel('검토할 지식','<p>원본 소유 측 확인과 독립 정책 승인을 구분합니다. 승인된 범위만 부서에 전달됩니다.</p>'+btn('지식화 검토 열기',"go('review')",'primary'));
 if(!canCase())return head('KNOWLEDGE WORKSPACE','우리 부서의 다음 업무에 쓰는 지식','허용된 사내 문서와 검증된 해결 지식을 함께 확인합니다.')+`<div class="hero"><div class="hero-copy"><div class="eyebrow">문서 + 검증된 처리 경험</div><h2>찾는 데서 끝나지 않고,<br><em>다음 결정에 활용합니다.</em></h2><p>현재 업무 소속: ${roles[state.role].dept}. 접근 가능한 게시 지식만 제공합니다.</p>${btn('허용된 지식 검색',"go('search')",'primary')}</div><div class="hero-proof"><div class="eyebrow">KNOWLEDGE LOOP</div><div class="mini-path"><b>1</b><div><strong>업무에 맞는 근거 찾기</strong><p>문서와 해결 사례의 출처 구분</p></div></div><div class="mini-path"><b>2</b><div><strong>정확한 버전으로 활용</strong><p>열람과 실제 적용 기록을 구분</p></div></div></div></div>`+panel('부서 지식함','<p>부서에 전달된 지식도 열람 시점에 권한을 다시 확인합니다.</p>'+btn('전달된 지식 확인',"go('distribution')"));
 return head('KNOWLEDGE CYCLE / OVERVIEW','접수된 목소리를, 다음 업무의 지식으로','VOC 처리와 사내 문서를 하나의 검증·배포·재사용 흐름으로 연결합니다.',tag('가상 업무 1건의 순환 현황','green'))+`<section class="hero"><div class="hero-copy"><div class="eyebrow">지금 이어갈 업무 · C-2041</div><h2>“업데이트 후 검색이 느려졌어요.”<br>이 문의가 <em>어떤 지식이 될까요?</em></h2><p>고객지원·운영·개발의 의견과 기존 운영 매뉴얼을 모아,<br>검증된 ‘검색 지연 대응 가이드’로 만듭니다.</p><div class="actions">${btn('해결 과정 이어보기 →',"go('case')",'primary')}${btn('완료된 순환 예시 보기',"showStory()")}</div></div><div class="hero-proof"><div class="eyebrow">하나의 사례, 연결된 산출물</div><div class="mini-path"><b>V</b><div><strong>접수된 VOC · V-2041</strong><p>기존 고객지원 시스템에서 반입</p></div></div><div class="mini-path"><b>C</b><div><strong>부서 협업 · C-2041</strong><p>운영 매뉴얼 + 부서 의견 + 조치 증거</p></div></div><div class="mini-path"><b>K</b><div><strong>검색 지연 대응 가이드</strong><p>${state.draft?'K-2041 v1 · '+(state.published?'게시됨':'검토 중'):'검증 후 생성할 지식 문서'}</p></div></div></div></section><div class="section-title"><h2>지금, 지식은 어디까지 왔나요?</h2><span class="small muted">샘플 업무 기준 · 단계별 이동</span></div><div class="journey">${loopSteps()}</div><div class="grid"><section class="panel"><div class="panel-head"><h2>다음 행동이 필요한 업무</h2>${tag('나와 연결된 업무')}</div><div class="work-row"><span class="bullet amber"></span><div><strong>검색 성능 저하 · 부서 결정을 확인해주세요</strong><p>C-2041 · 고객지원 / 운영 / 개발 · ${state.verified?'결과 검증 완료':'조치 결과 검증 필요'}</p></div>${btn('업무 열기',"go('case')",'small')}</div><div class="work-row"><span class="bullet"></span><div><strong>${state.draft?'지식 초안의 내용과 공유 범위를 검토해주세요':'해결 후, 조직에 남길 지식을 준비하세요'}</strong><p>원문은 관계자에게 · 정제된 처리 방법은 관련 부서에</p></div>${btn('지식화 보기',"go('review')",'small')}</div><div class="work-row"><span class="bullet"></span><div><strong>기존 사내 문서도 해결의 근거가 됩니다</strong><p>D-038 v3 · 검색 서비스 운영 매뉴얼</p></div>${btn('근거 문서',"showSource('manual')",'small')}</div></section>${panel('처리 완료와 지식 완성은 다릅니다',`<div class="info-row"><span>사람의 결정·증거</span>${tag(state.verified?'검증됨':'검증 대기',state.verified?'green':'amber')}</div><div class="info-row"><span>내용·공유 범위 승인</span>${tag(state.approved?'승인됨':'대기')}</div><div class="info-row"><span>부서 배포 · 실제 활용</span><strong>${state.distributed?1:0} / ${state.reused?1:0}</strong></div><div class="loop-proof"><strong>읽힌 지식보다, 쓰인 지식</strong><p>조회·수신 확인은 재사용 횟수에 포함하지 않습니다. 후속 업무의 결정에 연결해야 합니다.</p></div>`)}</div>`;}
function context(){return `<div class="context"><b>하나의 업무 여정</b><span>V-2041 → C-2041 → ${state.draft?'K-2041 v1':'지식 초안 예정'}</span><span class="context-right">${tag('원문 · 관계자 한정')}${tag('정제 지식 · 승인된 부서','green')}</span></div>`}
function casePath(){return `<div class="pathbar">${[['source','01 접수 기록'],['opinions','02 부서 협업'],['decision','03 사람 결정'],['outcome','04 결과 검증'],['knowledge','05 지식으로 남기기']].map(([id,n])=>`<button class="${state.tab===id?'active':''}" onclick="caseTab('${id}')">${n}</button>`).join('')}</div>`}
function caseTab(tab){state.tab=tab;render()}
function showSource(which){if(which==='raw'&&!canCase()){toast('원문 열람 권한이 없습니다.');return}modal(which==='manual'?'D-038 v3 · 검색 서비스 운영 매뉴얼':'V-2041 · 제한된 원본 기록',which==='manual'?`<div class="document"><div class="actions">${tag('기존 사내 문서','blue')}${tag('게시됨','green')}</div><h2>검색 지연 시 초기 점검</h2><p>1. 색인 작업 상태와 최근 설정 변경을 확인합니다.<br>2. 캐시 적중률과 응답 시간을 비교합니다.<br>3. 설정 조정 전 복구 지점을 확보합니다.</p><div class="scope">허용 범위: 사내 직원 · 가상 문서 발췌</div></div>`:`<div class="notice amber">READ_RAW를 가진 가상 관계자에게만 표시하는 예시입니다.</div><p>한빛제조 · 담당 연락처 [가상 비식별 정보]<br>“업데이트 후 문서 검색에 약 8초가 걸립니다.”</p><p class="small">외부 접수 ID CS-7821 · 원본 v1 · 정제문 v1</p>`)}
function showStory(){modal('한 건의 VOC가 다음 업무의 근거가 되기까지',`<div class="notice">별도의 완료된 가상 사례 C-1980입니다. 현재 C-2041의 상태를 변경하지 않습니다.</div><div class="timeline">${[['01 · 반입','기존 고객지원에서 접수된 문서 업로드 오류','고객이 이 시스템에 새 문의를 등록하는 과정이 아닙니다.'],['02 · 협업','운영·개발이 매뉴얼과 원인을 함께 검토','업로드 제한값과 고객 영향 확인 → 사람이 조치 확정'],['03 · 검증','제한값 조정 후 재현 시험 통과','조치 전후 증거와 적용 조건 기록'],['04 · 지식화','문서 업로드 실패 대응 가이드 v2','고객정보 제거 → 내용 검토 → 공유 범위 승인'],['05 · 배포','고객지원·운영팀 지식함에 전달','원본 문의는 계속 관계자만 열람'],['06 · 재사용','후속 Case C-2012의 조치 근거로 활용','정확한 지식 버전과 적용 사유 기록 → 검증 결과 축적']].map(([n,t,d])=>`<section><small>${n}</small><h3>${t}</h3><p>${d}</p></section>`).join('')}</div>`)}
function voicePage(){return head('01 / IMPORTED VOICE','이미 접수된 VOC를 업무로 연결합니다','기존 접수 채널의 기록을 반입해 정제하고, 담당 부서와 처리 업무를 연결합니다.',tag('고객용 접수 화면 아님'))+context()+`<div class="grid"><section class="panel"><div class="panel-head"><h2>반입된 VOC</h2>${tag('1건 · 가상 기록')}</div><div class="document"><div class="actions">${tag('고객지원 시스템','blue')}${tag('정제 완료','green')}<span class="mono">V-2041 · CS-7821</span></div><h2>업데이트 후 문서 검색 속도 저하</h2><blockquote>“업데이트 이후 검색 결과가 나오기까지 약 8초가 걸려 업무가 지연됩니다.”</blockquote><p class="small">반입 10.07 09:12 · 정제문 v1 · 중복 반입 없음</p><div class="scope">연락처와 개인 식별 정보는 정제문에서 제외했습니다. 제한된 원본은 별도 권한으로 확인합니다.</div><div class="notice purple"><strong>로컬 AI 제안 · 사람 확인 필요</strong><br>유형: 성능 저하 / 관련 부서: 운영·개발 / 참고: 검색 서비스 운영 매뉴얼</div><div class="actions">${btn('연결된 처리 업무 열기 →',"go('case')",'primary')}${btn('제한된 원본 보기',"showSource('raw')")}</div></div></section><div class="stack">${panel('접수 채널과 관리 시스템의 경계',`<div class="mini-path"><b>1</b><div><strong>기존 채널에서 고객 문의 접수</strong><p>고객지원 시스템 · 이메일 · 파일</p></div></div><div class="mini-path"><b>2</b><div><strong>Knowledge Loop로 기록 반입</strong><p>권한 검사 → 정제 → Case 연결</p></div></div><div class="mini-path"><b>3</b><div><strong>해결 경험을 지식으로 전환</strong><p>부서 협업 → 검증 → 승인·배포</p></div></div>`)}${panel('수집원 정보',`<div class="info-row"><span>소유 부서</span><strong>고객지원팀</strong></div><div class="info-row"><span>반입 방식</span><strong>가상 연결기</strong></div><div class="info-row"><span>원문 접근</span><strong>지정 관계자</strong></div><p class="small">전화·실시간 상담은 향후 고도화이며 현재 연동되지 않습니다.</p>`)}</div></div>`}
function casePage(){let body='';if(state.tab==='source')body=`<div class="document"><div class="actions">${tag('정제된 VOC','blue')}<span class="mono">V-2041 · CS-7821</span></div><h2>업데이트 이후 검색이 8초 걸립니다.</h2><blockquote>검색 결과를 기다리는 시간이 길어져 고객 업무가 지연되고 있습니다. 기존 환경에서는 2초 이내였습니다.</blockquote><div class="info-row"><span>담당 · 참여</span><strong>김도윤 / 운영팀 · 개발팀</strong></div><div class="info-row"><span>연결된 업무</span><strong>C-2041 · 성능 저하</strong></div><div class="scope">관계자는 원문을 확인하고, 다른 부서는 승인된 정제 지식만 전달받습니다.</div>${btn('부서별 의견 확인 →',"caseTab('opinions')",'primary')}</div>`;
if(state.tab==='opinions')body=`<div class="panel-body"><p class="small">서로 다른 부서의 판단을 하나의 결정으로 연결합니다.</p>${[['운영팀 · 오민준','캐시 설정부터 점검','전체 색인 재구축 전에 캐시 적중률과 최근 설정 차이를 확인할 수 있습니다.','채택'],['개발팀 · 한유진','색인 재구축은 후순위','운영 중 재구축은 부하를 높일 수 있습니다. 복구 가능한 설정 조정을 먼저 권고합니다.','조건 반영'],['고객지원팀 · 김도윤','고객 업무 영향 최소화','점검 시간과 복구 기준을 공유하고, 조치 전후 응답 시간을 확인해야 합니다.','검증 조건']].map(([who,title,text,status])=>`<div class="opinion"><header><strong>${who}</strong>${tag(status,'green')}</header><h3>${title}</h3><p>${text}</p><small class="muted">10.07 · 가상 의견 · 근거 D-038 v3</small></div>`).join('')}${btn('결정과 사유 남기기 →',"caseTab('decision')",'primary')}</div>`;
if(state.tab==='decision')body=`<div class="panel-body"><div class="notice purple"><strong>AI 제안</strong><br>색인 상태 확인 및 재구축 검토 · 확정 조치가 아닙니다.</div><h2>사람의 결정</h2><p>운영·개발 의견을 반영해 캐시 설정 점검과 복구 가능한 조정을 먼저 수행합니다.</p><label class="field">채택 사유와 적용 조건<textarea id="decision-reason" ${state.role!=='handler'?'disabled':''} placeholder="예: 업무 중단을 줄이기 위해 캐시 조정을 먼저 진행하고, 악화되면 복구합니다.">${esc(state.decision)}</textarea></label><p class="small muted">저장 후 내용을 바꾸면 결과 검증과 후속 승인도 다시 진행해야 합니다.</p><div id="case-error" class="error" role="alert"></div>${btn('결정 저장',"saveDecision()",'primary')}</div>`;
if(state.tab==='outcome')body=`<div class="panel-body"><div class="actions">${tag(state.decision?'결정 기록 있음':'결정 기록 필요',state.decision?'green':'amber')}${tag(state.verified?'결과 검증됨':'검증 대기',state.verified?'green':'amber')}</div><label class="field">조치 전 증거<textarea id="before">${esc(state.before||'가상 시험 기록: 동일 질의 10회, 응답 시간 약 8초.')}</textarea></label><label class="field">조치 후 증거<textarea id="after">${esc(state.after||'가상 시험 기록: 캐시 설정 조정 후 동일 질의 약 2초, 오류 증가 없음.')}</textarea></label><label class="field">적용 조건·한계<textarea id="limits">${esc(state.limits||'동일 버전·동일 데이터 환경의 가상 결과입니다. 다른 환경은 별도 검증이 필요합니다.')}</textarea></label><label class="field">결과 유형<select id="outcome-type"><option value="SUCCESS" ${!state.outcome||state.outcome==='SUCCESS'?'selected':''}>성공</option><option value="PARTIAL" ${state.outcome==='PARTIAL'?'selected':''}>부분 성공</option><option value="FAIL" ${state.outcome==='FAIL'?'selected':''}>실패 · 교훈으로 남기기</option></select></label><div id="case-error" class="error" role="alert"></div>${btn('증거 확인 · 결과 검증',"verifyOutcome()",'primary')}</div>`;
if(state.tab==='knowledge')body=`<div class="document"><div class="eyebrow">업무의 끝에서, 조직의 자산으로</div><h2>이 해결 과정을<br>다른 부서도 쓸 수 있게 남깁니다.</h2><p>문제 · 원인 · 조치 · 검증 증거 · 적용 조건을 문서로 구성합니다. 고객 식별 정보와 원문은 공유 범위에서 분리합니다.</p><div class="notice ${state.verified?'':'amber'}">${state.verified?'사람의 결정과 결과 증거가 확인되었습니다. 지식 초안을 만들 수 있습니다.':'결정 기록과 결과 검증을 먼저 완료해주세요.'}</div>${btn(state.draft?'작성된 지식 초안 보기 →':'검증된 결과로 지식 초안 만들기 →',"createDraft()",'primary')}</div>`;
return head('02 / COLLABORATIVE RESOLUTION','검색 속도 저하 · 해결 과정','C-2041 · 고객지원팀 김도윤 · 운영팀·개발팀 참여',tag(state.verified?'결과 검증 완료':'협업·검증 중',state.verified?'green':'amber'))+context()+casePath()+`<div class="case-layout"><section class="panel">${body}</section><div class="stack">${panel('해결에 사용한 사내 지식',`<div class="source-row">${tag('기존 사내 문서','blue')}<h3>검색 서비스 운영 매뉴얼</h3><p>D-038 v3 · 초기 점검 절차 · 게시됨</p>${btn('근거 문서 읽기',"showSource('manual')",'text')}</div><div class="notice">새로운 VOC도 기존 문서를 참고해 해결합니다. 검증된 결과는 다시 검색 가능한 지식으로 돌아옵니다.</div>`)}${panel('로컬 AI 조력자',`<p class="small">부서 의견과 근거를 비교해 사람의 결정을 돕습니다.</p><div class="actions" style="margin-top:12px">${btn('의견 요약',"aiAssist()",'small')}${tag('가상 응답','purple')}</div>`)}${panel('다음에 남길 지식',`<h3>${state.outcome==='FAIL'?'캐시 조정 실패 시 확인할 교훈':'검색 지연 대응 가이드'}</h3><p class="small" style="margin-top:8px">원본 업무 → 정제 문서 → 승인된 부서 → 후속 업무</p><div class="scope">원문: 지정 관계자<br>지식: 고객지원·운영팀 공유 제안</div>`)}</div></div>`}
function invalidate(){Object.assign(state,{verified:false,draft:false,submitted:false,sourceApproved:false,policyApproved:false,approved:false,published:false,distributed:false,ack:false,reused:false})}
function saveDecision(){if(state.role!=='handler'){toast('담당자만 결정을 저장할 수 있습니다.');return}const value=$('decision-reason').value.trim();if(!value){$('case-error').textContent='결정 사유를 입력해주세요.';return}invalidate();state.decision=value;state.tab='outcome';render();toast('결정이 저장되었습니다. 결과를 검증해주세요.')}
function verifyOutcome(){if(state.role!=='handler'){toast('담당자 시안에서 검증해주세요.');return}if(!state.decision){$('case-error').textContent='사람의 결정을 먼저 저장해주세요.';return}if(['before','after','limits'].some(id=>!$(id).value.trim())){$('case-error').textContent='전후 증거와 적용 조건을 모두 입력해주세요.';return}const record={before:$('before').value,after:$('after').value,limits:$('limits').value,outcome:$('outcome-type').value};invalidate();Object.assign(state,record,{verified:true,tab:'knowledge'});render();toast('가상 증거 검증 완료 · 지식 초안을 만들 수 있습니다.')}
function createDraft(){if(state.role!=='handler'||!state.verified){toast('담당자의 결정과 결과 검증이 필요합니다.');return}state.draft=true;go('review')}
function aiAssist(){modal('부서 의견 요약 · 가상 로컬 AI',`<div class="notice purple">고정된 시안 응답입니다. 실제 모델을 호출하지 않습니다.</div><p>운영팀은 캐시 점검을, 개발팀은 재구축 위험을 지적했습니다. 두 의견을 반영해 복구 가능한 조정을 먼저 수행하고, 고객지원팀이 요청한 전후 응답 시간을 증거로 확인할 수 있습니다.</p><div class="scope">근거: C-2041 부서 의견 · D-038 v3<br>미검증 의견을 공식 게시 지식과 구분합니다.</div>`)}
function reviewPage(){if(!state.draft)return head('03 / KNOWLEDGE TRANSFORMATION','해결 경험을 공유 가능한 지식으로','원본 문의와 처리 가이드를 비교하고 내용·공유 범위를 승인합니다.')+panel('아직 지식 초안이 없습니다',`<div class="empty"><h2>정제된 VOC만으로는 공식 지식이 되지 않습니다.</h2><p>사람의 결정과 조치 결과를 검증한 뒤 초안을 만듭니다.</p>${canCase()?btn('해결 과정으로 돌아가기',"go('case')",'primary'):''}</div>`);
return head('03 / KNOWLEDGE TRANSFORMATION','한 고객의 문의에서, 부서의 대응 가이드로','K-2041 v1 · 출처 C-2041 / D-038 v3 · 원문과 공유 지식은 별도 자원입니다.',tag(state.retired?'폐기':state.published?'게시됨':state.approved?'게시 가능':state.submitted?'승인 진행 중':'초안','green'))+context()+`<div class="comparison"><section class="panel"><div class="panel-head"><h2>원본 업무 · 관계자 한정</h2>${tag('접근 제한','amber')}</div><div class="document"><div class="mono">C-2041 / 정제된 처리 기록</div><h2>고객 환경의 검색 지연</h2><p>${canCase()?'한빛제조 업데이트 후 검색 지연 문의와 부서별 조치 기록.':'원본 본문 접근 권한이 없는 역할입니다. 정제 결과와 승인 증빙만 검토합니다.'}</p><div class="scope">${canCase()?'고객·환경·참여자 정보가 포함된 업무 기록입니다.':'원본 링크·세부 본문은 이 역할에 제공하지 않습니다.'}</div><h3>지식화 시 변경</h3><p><span class="redact">고객 식별 정보 제거</span><br>고객별 설정 → 일반화된 점검 항목<br>개인 의견 → 검증된 조치·조건<br>원문 연락처 → 문서에 포함하지 않음</p></div></section><div class="arrow" aria-hidden="true">→</div><section class="panel"><div class="panel-head"><h2>공유할 지식 · K-2041 v1</h2>${tag('정제 문서','green')}</div><div class="document"><div class="eyebrow">${state.outcome==='FAIL'?'검증된 실패 교훈':'검증된 처리 가이드'}</div><h2>${state.outcome==='FAIL'?'캐시 조정 실패 시 확인할 교훈':'검색 지연 대응 가이드'}</h2><h3>문제와 확인 순서</h3><p>최근 설정 변경과 색인 상태를 확인하고 캐시 적중률을 비교합니다.</p><h3>조치·검증 결과</h3><p>${esc(state.after||'')}</p><h3>적용 조건·한계</h3><p>${esc(state.limits||'')}</p><div class="scope">공유 제안: 고객지원팀 · 운영팀<br>영업팀 제외 · 원본 접근권은 확대되지 않음</div></div></section></div><div class="grid" style="margin-top:20px">${panel('내용 검토와 공유 범위 승인',`<div class="approval"><div><strong>1. 담당자 · 검토 제출</strong><p>결과 증거와 정제 내용을 확인합니다.</p></div>${tag(state.submitted?'제출됨':'대기',state.submitted?'green':'')}</div><div class="approval"><div><strong>2. 원본 소유자 · 공유 근거 확인</strong><p>정제 적정성과 원본 의존을 검토합니다.</p></div>${tag(state.sourceApproved?'확인됨':'대기',state.sourceApproved?'green':'')}</div><div class="approval"><div><strong>3. 독립 정책 승인자 · 범위 승인</strong><p>고객지원·운영팀으로 공유하는 이유를 검토합니다.</p></div>${tag(state.policyApproved?'확인됨':'대기',state.policyApproved?'green':'')}</div><div class="approval"><div><strong>4. 검토·게시자 · 내용 최종 승인</strong><p>앞선 승인과 현재 문서 버전을 함께 확인합니다.</p></div>${tag(state.approved?'승인됨':'대기',state.approved?'green':'')}</div><label class="check"><input id="review-confirm" type="checkbox"> 현재 버전의 내용·증거·공유 범위를 확인했습니다.</label><div class="actions">${btn(({handler:'검토 제출',sourceowner:'원본 소유자 확인',policyofficer:'공유 정책 승인',reviewer:'내용 최종 승인'})[state.role]||'승인',"approveStep()",'primary')}${state.role==='reviewer'?btn('승인 지식 게시',"publishKnowledge()") :''}</div><p class="small muted" style="margin-top:12px">시안 역할을 바꾸어 각자의 확인 과정을 살펴보세요. 하나의 버튼이 모든 승인을 대신하지 않습니다.</p>`)}${panel('배포 전 확인할 것',`<p>게시 이후 검색 색인 준비와 대상 부서 권한을 확인합니다.</p><div class="info-row"><span>원문 ACL</span><strong>그대로 유지</strong></div><div class="info-row"><span>공유 범위</span><strong>승인된 두 부서</strong></div><div class="info-row"><span>배포 방식</span><strong>지식 버전 링크</strong></div>${btn('부서 전달 화면으로 →',"go('distribution')",'text')}`)}</div>`}
function approveStep(){if(!$('review-confirm').checked){toast('내용·증거·공유 범위 확인이 필요합니다.');return}if(state.retired||state.published){toast('게시·폐기된 버전의 승인은 변경하지 않습니다.');return}if(state.role==='handler'){state.submitted=true}else if(!state.submitted){toast('담당자 검토 제출이 먼저 필요합니다.');return}else if(state.role==='sourceowner'){state.sourceApproved=true}else if(state.role==='policyofficer'){state.policyApproved=true}else if(state.role==='reviewer'){if(!state.sourceApproved||!state.policyApproved){toast('원본 소유자와 독립 정책 승인이 모두 필요합니다.');return}state.approved=true}else{return}render();toast('현재 역할의 검토 상태를 기록했습니다.')}
function publishKnowledge(){if(state.role!=='reviewer'||!state.approved||state.retired){toast('검토·게시자의 최종 승인 후 게시할 수 있습니다.');return}state.published=true;render();toast('가상 게시·색인 준비 완료 · 부서 배포는 별도 진행합니다.')}
function distributionPage(){const permitted=canKnowledge();return head('04 / DEPARTMENT DELIVERY','검증된 해결 방법을 필요한 부서에','문서를 복제하지 않고, 권한을 확인하는 지식 버전 링크를 전달합니다.')+`<div class="stat-grid"><div class="stat"><small>내 소속</small><strong style="font-size:20px">${roles[state.role].dept}</strong></div><div class="stat"><small>열람 가능한 신규 배포</small><strong>${permitted&&state.distributed&&!state.retired?1:0}</strong></div><div class="stat"><small>확인한 버전</small><strong>${permitted&&state.ack&&!state.retired?1:0}</strong></div></div>`+(state.role==='reviewer'?panel('배포할 버전과 대상',`<h3>${activeKnowledge()?'K-2041 v1 · 게시·색인 준비 완료':'배포 가능한 게시 지식이 없습니다'}</h3><label class="check"><input id="dept-support" type="checkbox" checked>고객지원팀 · 허용 범위</label><label class="check"><input id="dept-ops" type="checkbox" checked>운영팀 · 허용 범위</label><label class="check"><input id="dept-sales" type="checkbox">영업팀 · 현재 공유 범위 밖</label><div class="notice">대상 부서 선택은 접근 권한 부여가 아닙니다. 범위 밖 부서는 배포할 수 없습니다.</div>${btn('선택 부서에 버전 링크 배포',"distribute()",'primary')}`):'')+`<section class="panel" style="margin-top:20px"><div class="panel-head"><h2>우리 부서에 도착한 지식</h2>${tag('현재 소속 기준')}</div>${permitted&&state.distributed&&!state.retired?`<div class="result">${tag('VOC에서 생성된 검증 지식','green')}<h3>${state.outcome==='FAIL'?'캐시 조정 실패 시 확인할 교훈':'검색 지연 대응 가이드'}</h3><p>고객별 문의를 일반화한 처리 절차입니다. 원본 문의의 접근권은 따로 적용됩니다.</p><div class="result-footer"><span>K-2041 v1 · ${state.ack?'수신 확인됨':'확인 대기'}</span><div class="actions">${btn('문서 읽기',"openKnowledge()",'small')}${btn('이 버전 수신 확인',"acknowledge()",'primary small')}</div></div></div>`:`<div class="empty"><h2>현재 열람 가능한 배포 지식이 없습니다.</h2><p>승인·게시·배포를 마친 지식이 소속과 권한에 따라 표시됩니다.</p></div>`}</section><div class="scope">수신 확인은 읽었다는 기록입니다. 실제 재사용은 후속 업무에 지식 버전과 적용 사유를 연결해 별도로 남깁니다.</div>`}
function distribute(){if(state.role!=='reviewer'||!activeKnowledge()){toast('게시·색인 준비된 지식이 필요합니다.');return}if($('dept-sales').checked){toast('영업팀은 공유 범위 밖입니다. 배포하지 않았습니다.');return}if(!$('dept-support').checked||!$('dept-ops').checked){toast('이 시안은 고객지원·운영팀 공동 배포 사례입니다. 두 부서를 선택해주세요.');return}state.distributed=true;render();toast('두 부서에 K-2041 v1 링크를 전달했습니다.')}
function acknowledge(){if(!canKnowledge()||!state.distributed||!activeKnowledge())return;state.ack=true;render();toast('K-2041 v1 수신 확인 · 재사용 집계는 변경되지 않습니다.')}
function searchPage(){return head('05 / UNIFIED KNOWLEDGE','사내 문서와 해결 경험을 함께 찾습니다','현재 업무 소속에서 허용된 게시 지식만 답변 근거로 사용합니다.',tag('로컬 AI · 가상 응답','purple'))+`<form class="search" onsubmit="event.preventDefault();runSearch()"><input id="query" aria-label="지식 검색 질문" value="${esc(state.query)}" placeholder="검색 속도가 느릴 때 어떤 순서로 확인하나요?"><button class="btn primary" type="submit">근거 찾기 →</button></form><div class="actions">${btn('검색 지연 점검',"quickSearch()",'small')}<span class="small muted">선택 소속: ${roles[state.role].dept} · 기존 문서 / VOC 지식 출처 구분</span></div>${state.searched?(/검색|캐시|지연/.test(state.query)?`<div class="answer"><div class="actions">${tag('근거 기반 답변 예시','purple')}${tag('사람 확인 필요')}</div><h2 style="margin-top:10px">색인 상태와 캐시 설정부터 확인하세요.</h2><p>기존 운영 매뉴얼은 최근 설정 변경과 캐시 적중률 점검을 권고합니다. [1] ${activeKnowledge()&&canKnowledge()?state.outcome==='FAIL'?'검증된 실패 사례는 캐시 조정만으로 해결되지 않을 수 있음을 보여줍니다. 적용 조건을 확인하세요. [2]':'이번 해결 사례에서는 복구 가능한 캐시 조정 후 전후 응답 시간을 검증했습니다. 적용 조건을 먼저 확인하세요. [2]':'환경별 조치 효과는 별도의 검증이 필요합니다.'}</p><span class="small muted">실제 검색·모델 실행이 아닌 가상 시연 응답입니다.</span></div>`+searchResults():`<div class="panel empty" style="margin-top:20px"><h2>답변을 만들 근거가 없습니다.</h2><p>이 시안은 ‘검색 지연·캐시’ 사례를 제공합니다. 근거 없는 답변은 생성하지 않습니다.</p></div>`):`<div class="grid equal" style="margin-top:26px">${panel('기존 사내 문서',`${tag('MANUAL','blue')}<h3 style="margin-top:12px">조직이 이미 가진 기준과 절차</h3><p>운영 매뉴얼·업무 가이드·공식 문서를 근거로 확인합니다.</p>`)}${panel('VOC에서 생성된 지식',`${tag('VERIFIED EXPERIENCE','green')}<h3 style="margin-top:12px">현장에서 검증한 해결 방법</h3><p>사람의 조치·증거·적용 조건을 검토한 게시 지식을 찾습니다.</p>`)}</div>`}`}
function runSearch(){state.query=$('query').value.trim();state.searched=!!state.query;render()}
function quickSearch(){state.query='검색 지연 점검';state.searched=true;render()}
function searchResults(){return `<section class="panel"><div class="result">${tag('기존 사내 문서','blue')}<h3>[1] 검색 서비스 운영 매뉴얼</h3><p>색인 상태와 캐시 적중률을 확인하는 공식 점검 기준.</p><div class="result-footer"><span>D-038 v3 · 게시됨</span>${btn('출처 읽기',"showSource('manual')",'small')}</div></div>${activeKnowledge()&&canKnowledge()?`<div class="result">${tag('VOC에서 생성된 검증 지식','green')}<h3>[2] ${state.outcome==='FAIL'?'캐시 조정 실패 시 확인할 교훈':'검색 지연 대응 가이드'}</h3><p>부서 협업과 결과 검증으로 만든 ${state.outcome==='FAIL'?'실패 교훈':'처리 절차'}. 적용 조건과 한계를 포함합니다.</p><div class="result-footer"><span>K-2041 v1 · 고객지원·운영팀</span>${btn('해결 지식 읽기',"openKnowledge()",'small')}</div></div>`:''}</section>`}
function knowledgePage(){return head('KNOWLEDGE ASSETS','문서와 해결 경험이 쌓이는 지식 자산','원본 업무와 게시 문서를 구분하고, 버전·범위·활용 이력을 함께 관리합니다.')+`<div class="stat-grid"><div class="stat"><small>기존 사내 문서</small><strong>1</strong></div><div class="stat"><small>허용된 VOC 게시 지식</small><strong>${activeKnowledge()&&canKnowledge()?1:0}</strong></div><div class="stat"><small>후속 업무 활용</small><strong>${state.reused&&activeKnowledge()&&canKnowledge()?1:0}</strong></div></div>`+searchResults()+`<div class="scope">게시 지식이 회수·폐기되면 검색과 새 활용에서 제외됩니다. 기존 활용 기록은 감사 목적으로 보존하고 접근권을 재검사합니다.</div>`}

/* 하나의 진행 표시: 접수 · 처리 · 승인 · 공유(자동) */
function stageBar(){
 const ap=(state.sourceApproved?1:0)+(state.policyApproved?1:0);
 const s=[
  {t:'접수',d:'AI 경로 제안 · 지식화로 확정',done:true},
  {t:'처리',d:!state.decision?'의견 반영해 결정':state.verified?'결정·결과 검증 완료':'결과 검증 필요',done:!!state.decision&&state.verified},
  {t:'승인',d:!state.draft?'검증하면 초안 자동 생성':!state.submitted?'초안 확인 · 배포 부서 직접 선택 후 제출':state.approved?'승인 완료':`확대 승인 ${ap}/2 · 승인자가 부서 조정 후 승인`,done:state.approved},
  {t:'공유',d:state.retired?'폐기 · 배포 철회':state.distributed?`${state.targets.join('·')} 전달 완료`:state.indexing?'게시 · 색인 준비 중':'승인하면 게시·색인·전달',done:state.distributed||state.retired,auto:true}];
 const now=s.findIndex(x=>!x.done);
 return `<div class="stagebar" aria-label="지식화 진행 단계">${s.map((x,i)=>`<div class="stage ${x.done?'done':''} ${i===now?'now':''}" ${i===now?'aria-current="step"':''}><small>STEP ${i+1}${x.auto?' · 자동':''}</small><strong>${x.done?'✓ ':''}${x.t}</strong><span>${x.d}</span></div>`).join('')}</div>`;
}

/* 홈: 경로별 현황 + 지식화 후보 */
const homePageV20=homePage;
homePage=function(){
 const html=homePageV20();
 if(!canCase()||state.role==='sourceowner')return html;
 const n={QUICK:0,STANDARD:0,KNOWLEDGE:0};voices.forEach(v=>n[trackOf(v)]++);
 const tracks=`<div class="section-title"><h2>이번 VOC는 어떤 경로로 처리하나요?</h2><span class="small muted">AI 제안 · 담당자 확정 · 가상 3건</span></div><div class="track-grid">${Object.entries(TRACK).map(([k,[name,c]])=>`<button class="track-card" onclick="go('voice')"><span class="tag ${c}">${name}</span><strong>${n[k]}<span> 건</span></strong><p>${{QUICK:'게시된 지식으로 답하고 바로 종결 · 재사용 기록',STANDARD:'결정·결과만 기록하고 종결 · 의견은 필요할 때만',KNOWLEDGE:'새 문제·반복·다부서 · 검증 후 지식으로 공유'}[k]}</p></button>`).join('')}</div>`;
 const cand=state.candidateOpen?`<section class="panel candidate"><div class="panel-head"><h2>지식화 후보</h2>${tag('시스템 제안','purple')}</div><div class="panel-body"><strong>근거 지식 없이 반복된 ‘PDF 미리보기 깨짐’ 문의 3건</strong><p class="small">최근 30일 · C-2044, C-2031, C-2019 · 모두 개발팀 처리 · 기준: 근거 없는 유사 Case 3건</p><div class="actions" style="margin-top:12px">${btn('대표 Case로 지식화',"promoteCandidate()",'primary small')}${btn('지금은 넘기기',"dismissCandidate()",'small')}</div><p class="small muted" style="margin-top:8px">자동으로 초안을 만들거나 게시하지 않습니다.</p></div></section>`:state.candidatePromoted?`<div class="notice">C-2044를 대표로 지식화 경로로 승격했습니다. 나머지 2건은 같은 지식의 출처로 묶입니다.</div>`:'';
 return html.replace(/<div class="section-title"><h2>지금, 지식은 어디까지 왔나요\?<\/h2>[\s\S]*?<\/div><div class="journey">[\s\S]*?<\/div><div class="grid">/,`${tracks}${cand}<div class="section-title"><h2>지식화 중인 업무 · C-2041</h2><span class="small muted">하나의 진행 표시</span></div>${stageBar()}<div class="grid">`);
};
function promoteCandidate(){state.candidateOpen=false;state.candidatePromoted=true;state['track_V-2044']='KNOWLEDGE';render();toast('C-2044를 지식화로 승격했습니다. 경로 변경 이력이 남습니다.')}
function dismissCandidate(){modal('지식화 후보 넘기기',`<label class="field">넘기는 이유<input id="dismiss-reason" placeholder="예: 다음 업데이트에서 근본 수정 예정"></label><div id="dismiss-error" class="error" role="alert"></div>${btn('넘기기',"confirmDismiss()",'primary')}`)}
function confirmDismiss(){if(!$('dismiss-reason').value.trim()){$('dismiss-error').textContent='넘기는 이유를 입력해주세요.';return}$('modal').close();state.candidateOpen=false;render();toast('후보를 넘겼습니다. 사유가 기록됩니다.')}

/* 접수된 VOC: 목록 + 경로 제안·확정 + 경로별 처리 */
voicePage=function(){
 const v=vById(state.voice),t=trackOf(v),closed=state.quickClosed[v.id]||state.standardClosed[v.id];
 const list=voices.map(x=>`<button class="voice-row ${x.id===v.id?'active':''}" onclick="state.voice='${x.id}';render()"><span class="mono">${x.id} · ${x.time}</span><strong>${x.title}</strong><span>${tag(TRACK[trackOf(x)][0],TRACK[trackOf(x)][1])} ${tag(voiceStatus(x),voiceStatus(x).startsWith('종결')||voiceStatus(x).includes('완료')?'green':'')}</span></button>`).join('');
 const choose=`<fieldset class="track-pick" ${closed?'disabled':''}><legend>처리 경로 확정</legend>${Object.entries(TRACK).map(([k,[name]])=>`<label class="${t===k?'on':''}"><input type="radio" name="track" value="${k}" ${t===k?'checked':''} onchange="setTrack('${k}')">${name}${v.suggest===k?' <small>AI 제안</small>':''}</label>`).join('')}</fieldset>`;
 let act='';
 if(closed)act=`<div class="notice">${state.quickClosed[v.id]?`${v.kid}을 적용해 종결했습니다. 재사용 1건이 기록됐습니다.`:'결정과 결과를 기록하고 종결했습니다.'}</div>`;
 else if(t==='QUICK')act=v.kid?`<div class="kcard">${tag('게시 지식 · 현재 권한 확인','green')}<h3>${v.ktitle} · ${v.kid}</h3><p>${v.kbody}</p></div><label class="field">적용 사유<input id="quick-reason" value="등록 메일 확인 후 재발송 안내로 해결 가능"></label><div id="voice-error" class="error" role="alert"></div>${btn('이 지식으로 처리하고 종결',"quickResolve()",'primary')}<p class="small muted" style="margin-top:8px">맞지 않으면 경로를 일반 처리로 바꾸세요. ‘보완 필요’는 지식 소유자에게 전달됩니다.</p>`:`<div class="notice amber">답할 게시 지식이 없습니다. 일반 처리나 지식화로 진행하세요.</div>`;
 else if(t==='STANDARD')act=`<label class="field">결정과 사유<textarea id="std-decision">${v.id==='V-2044'?'PDF 렌더러의 표 처리 옵션을 조정하고 고객에게 다운로드 우회 방법을 안내합니다.':''}</textarea></label><label class="field">결과 요약<input id="std-result" value="${v.id==='V-2044'?'옵션 조정 후 해당 PDF 정상 표시 확인':''}"></label><label class="check"><input type="checkbox" id="std-knowledge"> 다른 부서도 알아야 할 내용입니다 · 종결 후 지식화로 전환</label><div id="voice-error" class="error" role="alert"></div>${btn('처리하고 종결',"standardClose()",'primary')}<p class="small muted" style="margin-top:8px">부서 의견·전후 증거는 필요할 때만 남깁니다.</p>`;
 else act=`<div class="notice purple">지식화 경로는 의견을 반영한 결정 → 결과 검증 → 승인 → 자동 공유 순서로 진행합니다.</div>${btn('지식화 업무 열기 →',"go('case')",'primary')}`;
 return head('01 / IMPORTED VOICE','접수된 VOC를 알맞은 경로로 처리합니다','대부분은 기존 지식으로 바로 끝내고, 새로운 문제만 지식으로 만듭니다.',tag('고객용 접수 화면 아님'))+`<div class="voice-layout"><section class="panel"><div class="panel-head"><h2>반입된 VOC</h2>${tag('3건 · 가상')}</div>${list}</section><section class="panel"><div class="panel-head"><h2>${v.id} · ${v.ext}</h2>${tag('정제 완료','green')}</div><div class="panel-body"><h2>${v.title}</h2><blockquote>“${v.quote}”</blockquote><div class="notice purple"><strong>로컬 AI 경로 제안 · ${TRACK[v.suggest][0]}</strong><br>${v.why}<br>관련 부서: ${v.dept}</div>${choose}${act}</div></section></div>`;
};
function setTrack(k){const v=vById(state.voice);const from=trackOf(v);if(from==='KNOWLEDGE'&&k!=='KNOWLEDGE'&&state.submitted){toast('지식 제출 후에는 경로를 낮출 수 없습니다.');render();return}state['track_'+v.id]=k;render();toast(`${TRACK[k][0]}로 확정했습니다. AI 제안(${TRACK[v.suggest][0]})과 함께 기록됩니다.`)}
function quickResolve(){if(state.role!=='handler'){toast('담당자 시안에서 처리해주세요.');return}if(!$('quick-reason').value.trim()){$('voice-error').textContent='적용 사유를 입력해주세요.';return}state.quickClosed[state.voice]=true;state.reuseCount++;render();toast('종결했습니다. K-1022 v3 재사용 1건 기록 · 검증 없는 결과라 지식 출처로는 쓰지 않습니다.')}
function standardClose(){if(state.role!=='handler'){toast('담당자 시안에서 처리해주세요.');return}if(!$('std-decision').value.trim()||!$('std-result').value.trim()){$('voice-error').textContent='결정·사유와 결과 요약을 입력해주세요.';return}const k=$('std-knowledge').checked;state.standardClosed[state.voice]=!k;if(k){state['track_'+state.voice]='KNOWLEDGE'}render();toast(k?'지식화 경로로 전환했습니다. 검증 항목을 보완해주세요.':'결정과 결과를 기록하고 종결했습니다.')}

/* Case: 탭 3개(접수 기록·결정·결과 검증)와 4단계 바 */
casePath=function(){return stageBar()+`<div class="pathbar">${[['source','접수 기록'],['decision','결정 · 부서 의견'],['outcome','결과 검증']].map(([id,n])=>`<button class="${state.tab===id?'active':''}" onclick="caseTab('${id}')">${n}</button>`).join('')}</div>`};
const casePageV20=casePage;
casePage=function(){
 if(['opinions','knowledge'].includes(state.tab))state.tab=state.tab==='opinions'?'decision':'outcome';
 let html=casePageV20();
 const ro=state.role!=='handler'?'disabled':'';
 if(state.tab==='decision'){
  const ops=state.opinions.map((o,i)=>`<div class="op-row"><div><strong>${o.who}</strong><p>${o.title} — ${o.text}</p></div><select aria-label="${o.who} 반영 여부" ${ro} onchange="state.opinions[${i}].adopt=this.value==='y'"><option value="y" ${o.adopt?'selected':''}>반영</option><option value="n" ${!o.adopt?'selected':''}>보류</option></select><input aria-label="${o.who} 판단 사유" id="op-reason-${i}" value="${esc(o.reason)}" ${ro} oninput="state.opinions[${i}].reason=this.value"></div>`).join('');
  const body=`<div class="panel-body"><div class="notice purple"><strong>AI 제안</strong><br>색인 상태 확인 및 재구축 검토 · 확정 조치가 아닙니다.</div><h3>부서 의견 반영</h3><p class="small muted">의견마다 반영 여부와 사유를 결정과 함께 저장합니다.</p>${ops}<div class="ext-slot"><button class="btn small" disabled>메일·메신저 기록 가져오기</button>${tag('확장 예정 · 인터페이스만 정의')}</div><h3 style="margin-top:18px">사람의 결정</h3><label class="field">채택 사유와 적용 조건<textarea id="decision-reason" ${ro} placeholder="예: 업무 중단을 줄이기 위해 캐시 조정을 먼저 진행하고, 악화되면 복구합니다.">${esc(state.decision||'운영·개발 의견을 반영해 캐시 설정 점검과 복구 가능한 조정을 먼저 수행합니다. 악화되면 즉시 복구합니다.')}</textarea></label><div id="case-error" class="error" role="alert"></div>${btn('결정 저장',"saveDecision()",'primary')}</div>`;
  html=html.replace(/<section class="panel"><div class="panel-body"><div class="notice purple"><strong>AI 제안<\/strong>[\s\S]*?결정 저장<\/button><\/div><\/section>/,`<section class="panel">${body}</section>`);
 }
 if(state.tab==='outcome'){
  html=html.replace(/<button class="btn primary" onclick="verifyOutcome\(\)">증거 확인 · 결과 검증<\/button>/,`<button class="btn primary" onclick="verifyOutcome()" ${state.verified?'disabled':''}>검증 완료 · 지식 초안 자동 생성</button>`+(state.draft?`<div class="kcard" style="margin-top:16px">${tag('AI 초안 · 사람 확인 필요','purple')}<h3>${state.outcome==='FAIL'?'캐시 조정 실패 시 확인할 교훈':'검색 지연 대응 가이드'} · K-2041 v1</h3><p>고객 식별 정보 제거 · 배포 대상 제안: ${state.targets.join(', ')}</p>${btn(state.submitted?'지식화 검토 보기 →':'초안 확인·제출 →',"go('review')",'primary small')}</div>`:''));
 }
 return html;
};
const saveDecisionV20=saveDecision;
saveDecision=function(){if(state.role==='handler'){for(let i=0;i<state.opinions.length;i++){if(!state.opinions[i].reason.trim()){$('case-error').textContent='부서 의견마다 반영·보류 사유를 입력해주세요.';return}}}saveDecisionV20()};
const verifyOutcomeV20=verifyOutcome;
verifyOutcome=function(){verifyOutcomeV20();if(!state.verified)return;state.draft=true;state.tab='outcome';render();toast('결과를 검증했고 AI가 지식 초안과 배포 대상을 제안했습니다.')};

/* 지식화 검토: 배포 대상 확정 · 조건부 확대 승인 · 승인하고 게시 */
const reviewPageV20=reviewPage;
reviewPage=function(){
 const html=reviewPageV20();if(!state.draft)return html;
 const cut=html.indexOf('<div class="grid" style="margin-top:20px">');
 const top=html.slice(0,cut).replace(/(<div class="context">[\s\S]*?<\/div>)/,'$1'+stageBar());
 const targets=targetPanel();
 const appr=[['sourceowner','원본 소유자 · 이수현','원본 의존 해제와 정제 범위 확인',state.sourceApproved],['policyofficer','정책 승인자 · 정하린','관계자 한정 → 제안 공유 범위 검토',state.policyApproved]];
 const sharing=panel('공유 확대 승인',`<p class="small">${sharingText()}</p>${appr.map(([r,n,d,ok])=>`<div class="approval"><div><strong>${n}</strong><p>${d}</p></div>${state.role===r&&state.submitted&&!ok?btn('승인',`approveShare('${r}')`,'primary small'):tag(ok?'승인됨':state.submitted?'요청됨':'제출 시 요청',ok?'green':'amber')}</div>`).join('')}`,tag('조건부','amber'));
 let action='';
 if(state.retired)action=tag('폐기된 버전');
 else if(state.indexing)action=tag('게시·색인 처리 중','amber');
 else if(state.published)action=btn('부서 지식함 보기',"go('distribution')");
 else if(state.role==='handler')action=state.submitted?tag('승인 진행 중','amber'):`<label class="check"><input id="review-confirm" type="checkbox"> 초안의 내용·증거·배포 대상을 확인했습니다.</label>${btn('검토 제출',"submitPlan()",'primary')}`;
 else if(state.role==='reviewer')action=state.submitted?`<label class="check"><input id="review-confirm" type="checkbox"> 현재 버전의 내용·증거·공유 범위를 확인했습니다.</label><div class="actions">${btn('반려',"rejectDraft()")}${btn('승인하고 게시',"approveAndPublish()",'primary')}</div>`:tag('담당자 제출 대기');
 else action=tag(state.submitted?'확대 승인 진행 중':'담당자 제출 대기','amber');
 return top+`<div class="grid equal" style="margin-top:20px">${targets}${sharing}</div><section class="panel action-bar"><span class="small">승인하면 게시 → 색인 → 대상 부서 전달이 자동으로 이어집니다.</span><div>${action}</div></section>`;
};
function submitPlan(){if(!$('review-confirm').checked){toast('내용·증거·배포 대상 확인이 필요합니다.');return}
 const c=cover();if(!state.sel.length){$('target-error').textContent='배포 대상 부서를 하나 이상 선택하세요.';return}
 if(c.out&&!state.policy){$('target-error').textContent='공유 범위 밖 인원의 처리 방법을 고르세요.';return}
 if(state.policy==='EXPAND')state.expanded=c.outU;
 state.submitted=true;render();toast('제출했습니다. 원본 소유자·정책 승인 요청을 동시에 보냈습니다.')}
function approveShare(r){if(state.role!==r||!state.submitted)return;if(r==='sourceowner')state.sourceApproved=true;else state.policyApproved=true;render();toast('승인을 기록했습니다.')}
function rejectDraft(){modal('지식 반려',`<label class="field">반려 사유<textarea id="reject-reason" placeholder="보완할 내용과 근거"></textarea></label><div id="reject-error" class="error" role="alert"></div>${btn('반려 확정',"confirmReject()",'danger')}`)}
function confirmReject(){if(!$('reject-reason').value.trim()){$('reject-error').textContent='반려 사유를 입력해주세요.';return}$('modal').close();Object.assign(state,{submitted:false,sourceApproved:false,policyApproved:false,approverChanges:[],expanded:[]});render();toast('반려했습니다. 담당자 초안 단계로 돌아갑니다.')}
function approveAndPublish(){
 if(state.role!=='reviewer'||!state.submitted)return;
 if(!$('review-confirm').checked){toast('내용·증거·공유 범위 확인이 필요합니다.');return}
 if(!state.sel.length){$('target-error').textContent='배포 대상 부서를 하나 이상 선택하세요.';return}
 if(!state.sourceApproved||!state.policyApproved){toast('원본 소유자와 정책 승인이 모두 필요합니다.');return}
 state.approved=true;state.indexing=true;render();toast(state.expanded.length?`승인했습니다. ${state.expanded.map(u=>org(u).n).join(', ')}에 열람 권한을 자동 설정하고 게시·색인 후 전달합니다.`:'승인했습니다. 게시·색인을 진행하고, 준비되면 부서에 자동 전달합니다.');

function units(sel=state.sel,excl=state.excl){const s=new Set();sel.forEach(x=>{s.add(x.id);if(x.sub)desc(x.id).forEach(d=>s.add(d))});excl.forEach(e=>[e,...desc(e)].forEach(d=>s.delete(d)));return[...s]}

  {t:'처리',d:procText('C-2041',!!state.decision,state.verified),done:!!state.decision&&state.verified},

  {t:'공유',d:state.retired?'폐기 · 배포 철회':state.distributed?`${state.targets.join('·')} 전달 완료`:state.indexing?'게시 · 색인 준비 중':'승인하면 게시·색인·전달',done:state.distributed||state.retired,auto:true}];
 const now=s.findIndex(x=>!x.done);
 return `<div class="stagebar" aria-label="진행 단계">${s.map((x,i)=>`<div class="stage ${x.done?'done':''} ${i===now?'now':''}" ${i===now?'aria-current="step"':''}><small>STEP ${i+1}${x.auto?' · 자동':''}</small><strong>${x.done?'✓ ':''}${x.t}</strong><span>${x.d}</span></div>`).join('')}</div>`;
};

const CASE_TABS=[['source','접수 기록'],['tasks','협업 업무'],['decision','부서 의견·결정'],['refs','참고 자료'],['outcome','결과 검증']];
let tabOverride=null;
casePath=function(){const c=curCase(),t=tabOverride||state.tab,a=taskAgg(c.id),n=crefsOf(c.id).length;
 const badge=id=>id==='tasks'&&a.req?`<span class="cnt">${a.done}/${a.req}</span>`:id==='refs'&&n?`<span class="cnt">${n}</span>`:'';
 return (c.id==='C-2041'?stageBar():caseStage(c))+`<div class="pathbar case-tabs" role="tablist">${CASE_TABS.map(([id,nm],i)=>`<button role="tab" aria-selected="${t===id}" class="${t===id?'active':''}" onclick="caseTab('${id}')"><b>${i+1}</b> ${nm}${badge(id)}</button>`).join('')}</div>`};
caseTab=function(tab){state.tab=tab==='opinions'?'decision':tab==='knowledge'?'outcome':tab;render()};
function actAs(role){state.role=role;if($('modal').open)$('modal').close();if(!roles[role].menus.includes(state.page))state.page='home';render();window.scrollTo(0,0);
 toast(role==='handler'?'메인 부서(고객지원팀) 담당자로 돌아왔습니다.':`${roles[role].dept} · ${myName()} 역할로 전환했습니다. Case 읽기·의견·연결된 조치만 할 수 있습니다.`)}

 return `<div class="case-switch"><span class="small muted">Case</span>${cs.map(c=>{return `<button class="${c.id===state.caseId?'on':''}" onclick="state.caseId='${c.id}';state.tab='${state.tab}';render()"><b>${c.id}</b> <span class="small">${esc(c.title)}</span></button>`}).join('')}</div>`}

 return `<div class="role-banner">${tag('협업 요청 범위','amber')}<span><b>${myDept()} · ${myName()}</b> — ${c.id}를 읽고 의견을 남기며, 우리 부서 협업 업무에 연결된 조치만 기록합니다. 원문(READ_RAW)과 문서 권한은 넓어지지 않고 각자의 ACL로 다시 확인합니다.</span>${btn('메인 부서 역할로 돌아가기',"actAs('handler')",'small')}</div>`}
function caseStatus(c){const a=taskAgg(c.id);if(c.closed)return['CLOSED','종결'];if(caseVerified(c))return['VERIFIED','결과 검증됨 · 종결 준비'];
 if(a.open.length)return['COLLECTING_OPINIONS',`관련 부서 대기 ${a.open.length}건`];if(c.id==='C-2041'?state.decision:c.decision)return['DECIDED','결정됨 · 결과 취합'];return['OPEN','메인 부서 처리']}
function summaryPanel(c){const label=caseStatus(c)[1];
 return panel('Case 요약',`<div class="info-row"><span>메인 부서 · 최종 책임</span><strong>${c.main} · ${c.handler}</strong></div><div class="info-row"><span>처리 경로</span>${tag(TRACK[c.track][0],TRACK[c.track][1])}</div><div class="info-row"><span>관련 부서 협업</span><strong>${c.rel.join(', ')||'없음'}</strong></div><div class="info-row"><span>Case 상태</span><strong>${label}</strong></div><div class="info-row"><span>원천 VOC</span><strong>${c.voice}</strong></div>`,tag(c.id))}
function swapLeft(html,body){return rx(html,/(<div class="case-layout"><section class="panel">)[\s\S]*?(<\/section><div class="stack">)/,(m,a,b)=>a+body+b)}
function decorate(html,c){html=rx(html,/<\/header>/,m=>m+caseSwitch()+roleBanner(c));
 html=rx(html,/<section class="panel"><div class="panel-head"><h2>(해결에 사용한 사내 지식|로컬 AI 조력자|다음에 남길 지식)<\/h2>[\s\S]*?<\/section>/g,()=>''); // 오른쪽 열은 Case 요약 중심
 return rx(html,/<div class="stack">/,m=>m+summaryPanel(c))}

const casePageV21=casePage;
casePage=function(){
 const vis=visibleCases();if(!vis.find(c=>c.id===state.caseId))state.caseId=(vis[0]||{}).id;
 const c=curCase();if(!c)return head('02 / CASE WORKSPACE','Case 작업 공간','협업 요청을 받은 Case가 없습니다.');
 let t=state.tab;if(t==='opinions')t='decision';if(t==='knowledge')t='outcome';if(!CASE_TABS.some(x=>x[0]===t))t='source';state.tab=t;
 if(c.id!=='C-2041')return decorate(genericCase(c,t),c);
 let html;
 if(t==='tasks'||t==='refs'){tabOverride=t;state.tab='source';try{html=casePageV21()}finally{state.tab=t;tabOverride=null}html=swapLeft(html,t==='tasks'?tasksBody(c):refsBody(c))}
 else html=casePageV21();
 if(t==='outcome'){const warn=taskAgg(c.id).open.length?`<div class="notice amber" style="margin:0 20px">필수 협업 업무 ${taskAgg(c.id).open.length}건이 아직 진행 중입니다. 관련 부서 회신을 취합한 뒤 검증하세요.</div>`:'';
  html=rx(html,/(<div class="case-layout"><section class="panel">)([\s\S]*?)(<\/section><div class="stack">)/,(m,a,b,d)=>a+warn+b+`<div class="panel-body cb-wrap">${closeBar(c)}</div>`+d)}
 html=html.replace('C-2041 · 고객지원팀 김도윤 · 운영팀·개발팀 참여','C-2041 · 메인 부서 고객지원팀 김도윤 · 관련 부서 운영팀·개발팀');
 return decorate(html,c);
};
function genericCase(c,t){const v=vq(c.voice);
 const body={source:genericSource,tasks:tasksBody,decision:genericDecision,refs:refsBody,outcome:genericOutcome}[t](c);
 const [code,label]=caseStatus(c);
 return head('02 / CASE WORKSPACE',esc(c.title),`${c.id} · 원천 ${c.voice} · 메인 부서 ${c.main} ${c.handler} · 관련 부서 ${c.rel.join('·')||'없음'}`,tag(label,c.closed?'green':'amber'))+casePath()+`<div class="case-layout"><section class="panel">${body}</section><div class="stack">${panel('권한 범위',`<div class="info-row"><span>메인 부서</span><strong>읽기·쓰기·결정·종결</strong></div><div class="info-row"><span>관련 부서(협업 업무)</span><strong>읽기·의견·연결된 조치</strong></div><div class="info-row"><span>원문</span><strong>접수·메인 부서 VOC 담당</strong></div><div class="info-row"><span>참고 문서</span><strong>문서별 ACL 재검사</strong></div>`)}${v&&v.dataset==='SYNTHETIC'?`<div class="notice purple">포트폴리오 시연용 가상 VOC · SYNTHETIC 데이터셋</div>`:''}</div></div>`}
function genericSource(c){const v=vq(c.voice),f=v.fin,a=v.ai;
 return `<div class="document"><div class="actions">${tag('정제된 VOC','blue')}${v.dataset==='SYNTHETIC'?tag('포트폴리오 시연용 가상 VOC','purple'):''}<span class="mono">${v.id} · ${esc(v.ext)}</span></div><h2>${esc(v.title)}</h2><blockquote>${showClean(maskPII(v.raw).text)}</blockquote><div class="kv"><div><span>접수 부서</span><b>${v.dept}</b></div><div><span>고객</span><b>${esc(v.cust)}</b></div><div><span>제품·서비스</span><b>${esc(v.prod)}</b></div><div><span>수신</span><b>${v.time} · ${v.dataset==='SYNTHETIC'?'MANUAL_DEMO':v.ch}</b></div></div><h3>분류 기록</h3><table class="cmp"><thead><tr><th>항목</th><th>AI 제안</th><th>사람 확정</th></tr></thead><tbody>${[['분류','cat'],['긴급도','urg'],['메인 부서','dept'],['처리 경로','track'],['관련 부서','rel']].map(([n,k])=>`<tr><th scope="row">${n}</th><td class="ai-col">${k==='track'?TRACK[a[k]][0]:k==='rel'?a.rel.join(', ')||'없음':a[k]}</td><td><b>${k==='track'?TRACK[f[k]][0]:k==='rel'?f.rel.join(', ')||'없음':f[k]}</b></td></tr>`).join('')}</tbody></table>${canRaw()?btn('원문 보기 (READ_RAW)',`toast('원문 열람이 감사 기록에 남습니다.')`,'small'):`<p class="small muted">${LOCK} 원문은 READ_RAW 권한이 필요합니다.</p>`}</div>`}

/* ---------- 협업 업무 ---------- */
const TSTEP=['REQUESTED','ACCEPTED','IN_PROGRESS','COMPLETED'],TLABEL={REQUESTED:'요청',ACCEPTED:'수락',IN_PROGRESS:'진행',COMPLETED:'완료',RETURNED:'반려',CANCELLED:'취소'};
const canMain=c=>state.role==='handler'&&myDept()===c.main;
function tasksBody(c){
 const ts=tasksOf(c.id),main=canMain(c)&&!c.closed;
 const pending=c.rel.filter(d=>!ts.some(t=>t.dept===d&&t.st!=='CANCELLED'));
 const form=main?`<details class="req-form" ${ts.length?'':'open'}><summary title="협업 요청은 원문·문서 권한을 넓히지 않습니다">＋ 관련 부서에 협업 요청</summary><div class="req-grid"><label class="field">대상 부서<select id="tq-dept">${[...new Set([...pending,...c.rel,...REL_DEPTS])].filter(d=>d!==c.main).map(d=>`<option>${d}</option>`).join('')}</select></label><label class="field">유형<select id="tq-type"><option>의견</option><option selected>작업</option><option>검토</option></select></label><label class="field">기한<input id="tq-due" type="date" value="2026-10-10"></label><label class="check"><input id="tq-req" type="checkbox" checked> 필수 업무 · 완료 전에는 종결 불가</label><label class="field wide">요청 메모<input id="tq-note" placeholder="무엇을 확인·처리해 달라는지 적어주세요"></label></div><div id="tq-error" class="error" role="alert"></div>${btn('협업 요청 보내기',`requestTask('${c.id}')`,'primary small')}</details>`:'';
 const hint=main&&pending.length?`<p class="small muted">확정된 관련 부서 중 아직 요청하지 않은 부서: <b>${pending.join(', ')}</b></p>`:'';
 const cards=ts.map(t=>taskCard(c,t)).join('')||`<div class="empty small"><h2>협업 업무가 없습니다.</h2><p>${c.track==='QUICK'?'바로 종결 경로는 협업 없이 게시 지식으로 처리합니다.':'메인 부서가 필요할 때 관련 부서에 의견·작업·검토를 요청합니다.'}</p></div>`;
 return `<div class="panel-body">${form}${hint}<div class="task-list" title="협업 요청은 원문·문서 권한을 넓히지 않습니다">${cards}</div>${closeBar(c)}</div>`}
function taskCard(c,t){
 const idx=TSTEP.indexOf(t.st),mine=myDept()===t.dept&&isTaskRole(),main=canMain(c)&&!c.closed;
 let chips;
 if(t.st==='RETURNED')chips=`<span class="chip-s done">요청</span><span class="chip-s ret">반려</span>`;
 else if(t.st==='CANCELLED')chips=`<span class="chip-s done">요청</span><span class="chip-s ret">취소</span>`;
 else chips=TSTEP.map((s,i)=>`<span class="chip-s ${i<idx||(i===idx&&s==='COMPLETED')?'done':i===idx?'now':''}">${TLABEL[s]}</span>`).join('<i>→</i>');
 let act='';
 if(mine&&!c.closed){if(t.st==='REQUESTED')act=btn('수락',`advTask('${c.id}','${t.id}','ACCEPTED')`,'primary small')+btn('반려',`returnTask('${c.id}','${t.id}')`,'small');
  else if(t.st==='ACCEPTED')act=btn('진행 시작',`advTask('${c.id}','${t.id}','IN_PROGRESS')`,'primary small');
  else if(t.st==='IN_PROGRESS')act=`<label class="field wide">완료 회신(메인 부서에 돌아갑니다)<textarea id="reply-${t.id}" rows="2">${t.dept==='개발팀'&&c.id==='C-2041'?'5.2에서 캐시 TTL 기본값이 300초→30초로 바뀐 것을 확인했습니다. TTL 원복은 복구 가능한 조정입니다.':t.dept==='개발팀'?'표 셀 병합 옵션이 5.2에서 기본 해제되어 재현됩니다. 옵션 재활성화로 해결됩니다.':''}</textarea></label>`+btn('완료 회신',`advTask('${c.id}','${t.id}','COMPLETED')`,'primary small')}
 else if(main&&OPEN(t)){if(TASK_ROLE[t.dept])act=btn(`${t.dept} 역할로 전환해 처리 →`,`actAs('${TASK_ROLE[t.dept]}')`,'small');else act=`<span class="small muted">시안 역할 없음</span>`;if(!t.req)act+=btn('요청 취소',`advTask('${c.id}','${t.id}','CANCELLED')`,'small text')}
 else if(main&&t.st==='RETURNED')act=btn('다시 요청',`advTask('${c.id}','${t.id}','REQUESTED')`,'small');
 return `<article class="task-card ${mine?'mine':''}"><header><div class="actions"><b>${t.dept}</b>${tag(t.type,'blue')}${t.req?tag('필수','amber'):tag('선택')}${t.who?`<span class="small muted">담당 ${t.who}</span>`:''}</div><span class="small muted nowrap"><span class="mono">${t.id}</span> · 기한 ${t.due}</span></header><p class="t-note">${esc(t.note)}</p><div class="steps">${chips}</div>${t.reply?`<div class="reply"><b>${t.st==='RETURNED'?'반려 사유':'회신'}</b> ${esc(t.reply)}</div>`:''}${act?`<div class="actions t-act">${act}</div>`:''}</article>`}
function requestTask(cid){const c=state.cases[cid];if(!canMain(c)){toast('메인 부서 담당자만 협업을 요청할 수 있습니다.');return}
 const dept=$('tq-dept').value,type=$('tq-type').value,note=$('tq-note').value.trim(),d=$('tq-due').value;
 if(!note){$('tq-error').textContent='요청 메모를 입력해주세요.';return}
 if(tasksOf(cid).some(t=>t.dept===dept&&t.type===type&&OPEN(t))){$('tq-error').textContent=`${dept}에 같은 유형의 진행 중인 요청이 있습니다.`;return}
 const id=`T-${cid.slice(2)}-${tasksOf(cid).length+1}`;
 tasksOf(cid).push({id,dept,who:{'운영팀':'오민준','개발팀':'한유진'}[dept]||'',type,req:$('tq-req').checked,due:d?`${d.slice(5,7)}.${d.slice(8,10)}`:'—',note,st:'REQUESTED',reply:'',hist:[`요청 ${clock().slice(6)}`]});
 if(!c.rel.includes(dept))c.rel.push(dept);
 render();toast(`${dept}에 ${type} 요청을 보냈습니다 · ${dept}에는 이 Case 읽기·의견 권한만 생깁니다.`)}
function advTask(cid,tid,to){const c=state.cases[cid],t=tasksOf(cid).find(x=>x.id===tid);
 const mine=myDept()===t.dept&&isTaskRole(),main=canMain(c);
 if(['ACCEPTED','IN_PROGRESS','COMPLETED'].includes(to)&&!mine){toast(`${t.dept} 담당자만 이 업무를 처리할 수 있습니다.`);return}
 if(['CANCELLED','REQUESTED'].includes(to)&&!main){toast('메인 부서만 요청을 취소하거나 다시 보낼 수 있습니다.');return}
 if(to==='CANCELLED'&&t.req){toast('필수 업무는 취소하지 않습니다.');return}
 if(to==='COMPLETED'){const r=($('reply-'+tid)||{}).value;if(!r||!r.trim()){toast('완료 회신 내용을 입력해주세요.');return}t.reply=r.trim();
  if(cid==='C-2041')state.opinions.push({who:`${t.dept} · ${t.who||myName()} (협업 ${t.id})`,title:`${t.type} 회신`,text:t.reply,adopt:true,reason:''});}
 if(to==='REQUESTED')t.reply='';
 t.st=to;t.hist.push(`${TLABEL[to]} ${clock().slice(6)}`);if(!t.who&&mine)t.who=myName();
 render();toast(to==='COMPLETED'?`${t.dept} 회신 완료 · 메인 부서(${c.main})로 돌아갔습니다. 종결은 메인 부서가 합니다.`:`${t.id} · ${TLABEL[to]}`)}
function returnTask(cid,tid){modal('협업 요청 반려',`<p class="small">반려하면 메인 부서가 내용을 고쳐 다시 요청하거나 다른 부서에 요청합니다.</p><label class="field">반려 사유<input id="ret-reason" placeholder="예: 우리 부서 소관이 아님 · 운영팀 확인 필요"></label><div id="ret-error" class="error" role="alert"></div>${btn('반려',`confirmReturn('${cid}','${tid}')`,'danger')}`)}

/* ---------- 새 폴더 · 폴더 권한 변경 · 삭제 ---------- */
/* 새 폴더의 권한: 시작 규칙(최상위 = 부서 템플릿, 하위 = 상위 폴더) + 만들 때 직접 추가하는 규칙.
   [대상 추가] 대화상자를 'nf' 모드로 재사용해 규칙을 이 화면으로 돌려받는다. 만들면 폴더는 바로 생기고, 넓히는 규칙만 승인 대기 */
let NF=null;
const nfObj=()=>({id:'nf',name:NF.name.trim()||'새 폴더',dept:NF.dept,grade:NF.grade,parent:NF.parent,extra:NF.extra||[],rules:NF.rules,broken:NF.broken?{by:meName(),at:clock(),why:''}:null});
const nfBase=()=>Object.assign(nfObj(),{rules:[],extra:[],broken:null});        // 시작 권한(직접 규칙 없음)
const nfKey=()=>[NF.dept,NF.parent,NF.grade].join('|');
function nfSnap(){if(!NF||!$('nf-name'))return;const p=$('nf-parent').value||null;Object.assign(NF,{name:$('nf-name').value,dept:$('nf-dept').value,parent:p,grade:p?fGrade(fd(p)):+$('nf-grade').value,reason:$('nf-reason').value})}
/* 시작 권한보다 넓히는가: 사람이 늘거나 권한 수준이 올라가면 승인 대상 */
function nfWiden(c){const s=nfBase();return ruleDiff(liveRules(s),withO(s,{rules:[c]},()=>liveRules(s))).dir==='wide'}
/* 조정한 시작 규칙: 원래 규칙(orig)과 견줘 넓히는가 */
function nfAdjWiden(r){const o=nfObj();return ruleDiff(withO(o,{rules:NF.rules.map(x=>x===r?r.orig:x)},()=>liveRules(o)),liveRules(o)).dir==='wide'}

function inhChain(o){if(o.broken)return[];if(!o.owner)return fLine(fd(o.parent)).reverse();const f=fd(o.folder);if(!f||o.grade>fGrade(f))return[];return fLine(f).reverse()}

function aclEval(o,b){const rules=[...inhChain(o).flatMap(f=>(f.rules||[]).filter(isOn)),...(o.rules||[]).filter(isOn)];
 const S=new Set(b.g===0?ALL_DEPTS:[...(b.g===1?[b.dept]:[]),...b.extra]),denied=new Set(),ok=cl=>b.g===0||cl>=b.g;let meAllow=false,meDeny=false;

 const add=[],rm=[],ex=[],unex=[],chg=[];let wide=false,narrow=false;

  if(o.to&&(!r.to||r.to>o.to))w.push(r.to?'기간 연장':'만료 삭제');if(o.scope&&o.scope!==r.scope)w.push('범위 확대');if(r.sub&&!o.sub)w.push('하위 포함');if(o.from&&(!r.from||r.from<o.from))w.push('시작 앞당김');
  if(w.length){wide=true;chg.push([r,w.join('·')])}});
 al(B).forEach(r=>{const a=lv(A,r);if(r.level>a){rm.push(Object.assign({},r,{now:a}));narrow=true;return}const n=al(A).find(x=>rkey(x)===rkey(r));if(!n)return;const w=[];

function diffList(d){const uq=a=>{const m=new Map();a.forEach(r=>m.set(rkey(r)+'|'+r.level,r));return[...m.values()]},nm=r=>esc(r.target),parts=[];

 if(d.unex.length)parts.push('제외 해제: '+uq(d.unex).map(nm).join(', '));

 modal(`${r.cfg} 활성화`,`<p class="small"><b>${r.cfg}</b> · ${state.ev.cfg[r.cfg]}<br>관문 통과 실행 ${r.id} · 판정 PASS · ACL 누출 0건 · ${SEC_ITEMS} 통과</p><p class="small muted">지금 활성 구성 ${state.ev.active}는 롤백 대상으로 남습니다. 활성화 이력이 기록됩니다.</p><div class="actions" style="justify-content:flex-end">${btn('취소',"$('modal').close()")}${btn('활성화',`doActivate('${id}')`,'primary')}</div>`)}
function doActivate(id){const r=evRun(id),ev=state.ev;ev.hist.unshift({kind:'ACTIVATE',cfg:r.cfg,prev:ev.active,run:r.id,at:'10.09'});ev.active=r.cfg;$('modal').close();render();toast(`${r.cfg}를 활성화했습니다 · 관문 통과 ${r.id} · 이력 기록`)}
function openRollback(){const b=evBack();if(!b){toast('되돌릴 이전 구성이 없습니다.');return}
 modal('이전 구성으로 롤백',`<p class="small"><b>${state.ev.active} → ${b}</b> · ${state.ev.cfg[b]}</p><p class="small muted">${b}는 이전에 평가 관문을 통과해 활성화된 구성입니다. 새 평가 없이 바로 되돌리고, 롤백 이력(이전·이후 구성)이 남습니다.</p><label class="field">사유 <b class="req">*</b><input id="rb-reason" placeholder="예: 답변 근거 일치 하락 보고" oninput="$('rb-error').textContent=''"></label><div id="rb-error" class="error" role="alert"></div><div class="actions" style="justify-content:flex-end">${btn('취소',"$('modal').close()")}<button id="rb-go" class="btn danger" onclick="doRollback()">롤백</button></div>`)}
function doRollback(){const b=evBack(),why=$('rb-reason').value.trim();if(!why){$('rb-error').textContent='사유를 입력해주세요.';return}const ev=state.ev;
 ev.hist.unshift({kind:'ROLLBACK',cfg:b,prev:ev.active,run:'',at:'10.09',why});ev.active=b;$('modal').close();render();toast(`${b}로 롤백했습니다 · 이력 기록`)}
function fbAct(id,ok){const f=state.fbQ.find(x=>x.id===id);if(!f)return;f.st=ok?'승격':'반려';render();toast(ok?`${id}를 평가 항목(DEV)으로 승격했습니다 · 승인자 ${myName()} 기록`:`${id}를 반려했습니다 · 평가셋에 쓰지 않습니다`)}
function qualityPage(){const ev=state.ev,b=evBack(),a=ev.runs.find(r=>r.cfg===ev.active&&evPass(r));
 const runs=`<div class="table-wrap"><table class="ev-table"><thead><tr><th>실행</th><th>구성</th><th>판정</th><th>ACL 누출</th><th>보안 항목</th><th>작업</th></tr></thead><tbody>${ev.runs.map(evRow).join('')}</tbody></table></div><p class="small muted ev-note">PASS 조건: ACL 누출 0건 · ${SEC_ITEMS} 통과. 판정은 eval_runs에, 지표는 MLflow(로컬)에 기록합니다.</p>`;
 const fq=state.fbQ.map(f=>`<div class="fbq-row"><div><b>${f.id} · ${esc(f.what)}</b><span class="small muted">${tag(f.kind)} ${esc(f.reason)}${f.fix?` · 수정안: ${esc(f.fix)}`:''} · ${esc(f.by)}</span></div><div class="actions">${f.st?tag(f.st==='승격'?'평가 항목(DEV) 승격':'반려',f.st==='승격'?'green':''):`${btn('평가 항목으로 승격',`fbAct('${f.id}',1)`,'small')}${btn('반려',`fbAct('${f.id}',0)`,'small text')}`}</div></div>`).join('')||'<p class="small muted">검토할 피드백이 없습니다.</p>';
 const M=[['소형 dense 8B','Qwen3-8B · Llama 3.1 8B급','0.71','0.80','약 70','약 6GB'],['중형 dense 14B','Qwen3-14B급','0.78','0.87','약 42','약 10GB'],['MoE 20~30B','gpt-oss-20b · Qwen3-30B-A3B급','0.80','0.86','약 55','13~16GB + RAM']];
 const cmp=`<div class="table-wrap"><table class="m3"><thead><tr><th>구분</th><th>답변 품질</th><th>근거 일치</th><th>초당 토큰</th><th>VRAM</th></tr></thead><tbody>${M.map(r=>`<tr><th scope="row">${r[0]}<div class="small muted">${r[1]}</div></th>${r.slice(2).map(x=>`<td class="exv">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted ev-note">모든 값은 예시입니다(실측 필요) · RTX 5080 16GB · 4bit 양자화 · 같은 평가셋·프롬프트·Reranker로 측정해 기록합니다.</p>`;
 const hist=ev.hist.slice(0,3).map(h=>`${h.at} ${h.kind==='ROLLBACK'?'롤백':'활성화'} ${h.prev} → ${h.cfg}${h.run?` (${h.run})`:''}`).join(' · ');
 return head('OPERATIONS / QUALITY · EVAL GATE','평가 없이 바꾸지 않습니다','모델·프롬프트·파이프라인 구성은 평가셋 PASS 실행이 있어야 활성화하고, 언제든 이전 구성으로 되돌립니다.',tag('예시 데이터 · 실측 필요','amber'))
 +`<section class="panel gate-bar"><div class="gb-k"><span>활성 구성</span><b class="mono">${ev.active}</b><small>${ev.cfg[ev.active]}${a?` · 관문 통과 ${a.id}`:''}</small></div><div class="gb-h"><span>활성화·롤백 이력</span><small>${hist}</small></div><div class="gb-act"><button class="btn danger small" ${b?'':'disabled'} onclick="openRollback()">이전 구성으로 롤백${b?` (${b})`:''}</button></div></section>`
 +`<section class="panel" style="margin-top:20px"><div class="panel-head"><h2>평가셋 실행</h2>${tag('고정 평가셋 · 보안 항목 포함')}</div><div class="panel-body">${runs}</div></section>`
 +`<div class="grid ev-grid" style="margin-top:20px">${panel('피드백 검토 대기',`<p class="small muted">피드백은 자동으로 평가셋·학습 데이터가 되지 않습니다. 검토·승인한 것만 평가 항목(DEV)으로 승격하며, 작성자 본인은 승인할 수 없습니다.</p>${fq}`,tag('사람 검토','purple'))}${panel('모델 3점 비교',cmp,tag('예시','amber'))}</div>`}
// 제품명 표기: Enterprise Knowledge Loop (회사명 'Knowledge Loop 주식회사'는 그대로)
function entBrandText(root){const w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);const re=/(^|[^A-Za-z])Knowledge Loop(?! 주식회사)/g;let n;while((n=w.nextNode())){if(n.parentElement&&n.parentElement.closest('.brand'))continue;if(n.nodeValue.includes('Knowledge Loop')&&!n.nodeValue.includes('Enterprise Knowledge Loop')){n.nodeValue=n.nodeValue.replace(re,'$1Enterprise Knowledge Loop')}}}
render=(function(f){return function(...a){const r=f.apply(this,a);entBrandText();return r}})(render);
showLogin=(function(f){return function(...a){const r=f.apply(this,a);entBrandText(document.getElementById('modal')||document.body);return r}})(showLogin);

if(document.readyState!=='loading'&&!$('nav').innerHTML){$('role').innerHTML=Object.entries(roles).map(([key,r])=>`<option value="${key}">${r.name}</option>`).join('');render()}

<script id="workflow-ux-script">
/* Original-preserving design variant. Local fixture interaction only. */
'use strict';
const refinementOriginal={render,stageBar,approveShare,submitPlan};
function refinementScope(){
 const base=cover(state.sel,state.excl,[]);
 const recipients=units().filter(id=>org(id)?.h>0).filter(id=>state.policy!=='READABLE_ONLY'||SCOPE.includes(id));
 const selected=[...new Set(crefsOf('C-2041').filter(u=>state.official[u.ref]).map(u=>u.ref))].filter(k=>REFS[k]);
 const restrictive=selected.filter(k=>recipients.some(id=>!REFS[k].read.includes(org(id).n)));
 const expanding=state.policy==='EXPAND'&&base.out>0;
 return{required:expanding||restrictive.length>0,recipients,selected,restrictive,expanding};
}
function refinementApprovalStamp(){const s=refinementScope();return{recipients:[...s.recipients],refs:s.selected.map(k=>k+':'+REFS[k].ver).sort(),content:JSON.stringify([state.decision,state.before,state.after,state.limits,state.outcome,state.opinions,state.refinementHumanDraft])}}
function refinementStampValid(stamp){if(!stamp)return false;const current=refinementApprovalStamp();return current.content===stamp.content&&JSON.stringify(current.refs)===JSON.stringify(stamp.refs)&&current.recipients.every(id=>stamp.recipients.includes(id))}
function refinementPending(){return (state.sourceApproved&&refinementStampValid(state.refinementSourceStamp)?1:0)+(state.policyApproved&&refinementStampValid(state.refinementPolicyStamp)?1:0)}
stageBar=function(){let h=refinementOriginal.stageBar();if(state.submitted&&!state.approved){const s=refinementScope(),label=s.required?`공유 확대 검토 ${refinementPending()}/2 · 병렬 진행`:'독립 승인자 검토·게시 대기';h=h.replace(/확대 승인 \d\/2 · 승인자가 부서 조정 후 승인/g,label)}return h};
submitPlan=function(){
 if(state.role!=='handler'||!state.draft||!state.verified){toast('담당자가 검증된 결과의 초안을 제출합니다.');return}
 if(!$('review-confirm')?.checked){toast('내용·공식 근거·배포 대상을 확인해주세요.');return}
 if(!state.sel.length){$('target-error').textContent='배포 대상 부서를 하나 이상 선택하세요.';return}
 const base=cover(state.sel,state.excl,[]);if(base.out&&!state.policy){$('target-error').textContent='공유 범위 밖 인원의 처리 방법을 골라주세요.';return}
 state.expanded=state.policy==='EXPAND'?[...base.outU]:[];
 state.sourceApproved=false;state.policyApproved=false;state.refinementSourceStamp=null;state.refinementPolicyStamp=null;
 state.refinementSubmitter=myName();state.submitted=true;render();
 toast(refinementScope().required?'제출했습니다. 필요한 소유 측·정책 확대 검토를 동시에 요청했습니다.':'제출했습니다. 추가 범위 확대 없이 독립 승인자가 검토합니다.');
};
approveShare=function(role){
 if(state.role!==role||!state.submitted||!refinementScope().required||myName()===state.refinementSubmitter){toast('요청자와 다른 확대 승인 담당자가 확인합니다.');return}
 if(role==='sourceowner'){state.sourceApproved=true;state.refinementSourceStamp=refinementApprovalStamp()}
 else if(role==='policyofficer'){state.policyApproved=true;state.refinementPolicyStamp=refinementApprovalStamp()}
 else return;
 render();toast('공유 확대 검토를 기록했습니다. 두 검토가 끝나면 최종 승인할 수 있습니다.');
};
approveAndPublish=function(){
 if(state.role!=='reviewer'||!state.submitted||state.retired||myName()===state.refinementSubmitter){toast('제출자와 다른 검토·게시 담당자가 승인합니다.');return}
 if(!$('review-confirm')?.checked){toast('현재 내용·증거·공유 범위를 확인해주세요.');return}
 if(!state.sel.length){$('target-error').textContent='배포 대상 부서를 하나 이상 선택하세요.';return}
 if(refinementScope().required&&refinementPending()!==2){toast('공유 확대가 필요한 건입니다. 현재 범위의 소유 측·정책 검토가 모두 필요합니다.');return}
 state.approved=true;state.indexing=true;render();toast('승인했습니다. 게시·색인 준비 후 부서에 자동 전달합니다.');
 const revision=JSON.stringify(refinementApprovalStamp());
 setTimeout(()=>{if(state.retired||!state.indexing||!state.approved||revision!==JSON.stringify(refinementApprovalStamp()))return;state.indexing=false;state.published=true;state.distributed=true;render();toast('검색 준비 완료 · 승인된 범위의 부서 지식함에 전달했습니다.')},1500);
};
function refinementOpinions(c){return c.id==='C-2041'?state.opinions.map(o=>({who:o.who,title:o.title,text:o.text})):tasksOf(c.id).filter(t=>t.st==='COMPLETED').map(t=>({who:t.dept,title:'협업 회신',text:t.reply}))}
function refinementReadableRefs(c){return [...new Set([...crefsOf(c.id).map(u=>u.ref),...(vq(c.voice)?.ai?.refs||[])])].filter(k=>refOk(k)&&canReadRef(k))}
function refinementAiPanel(){const c=curCase();return `<section class="panel refinement-ai"><div class="panel-head"><h2>AI 처리 조력자</h2>${tag('로컬 AI · 가상 분석','purple')}</div><div class="panel-body"><p class="small">현재 VOC와 부서 의견을 정리하고, 읽을 수 있는 문서·해결 사례로 판단을 돕습니다.</p><div class="refinement-ai-actions">${btn('의견 요약·비교',"refinementAssist('compare')",'small')}${btn('확인사항 정리',"refinementAssist('check')",'small')}${btn('문서·해결 사례 추천',"caseTab('refs')",'small text')}</div><label class="field">이 Case에 추가로 확인할 내용<input id="refinement-ai-question" placeholder="예: 두 부서의 의견에서 공통점과 주의점을 알려줘"></label>${btn('AI에게 요청',"refinementAssist('question')",'small primary')}<p class="small muted" style="margin-top:10px">AI 결과는 제안입니다. 사람 결정에 자동 저장되지 않습니다.</p></div></section>`}
function refinementAssist(mode){
 const c=curCase();if(!c||!visibleCases().some(x=>x.id===c.id)||!roles[state.role].menus.includes('case'))return;
 const q=$('refinement-ai-question')?.value.trim()||'';if(mode==='question'&&!q){toast('확인할 내용을 입력해주세요.');return}
 const ops=refinementOpinions(c),refs=refinementReadableRefs(c),previous=state.refinementAiLog||[];
 state.refinementAiLog=[...previous,{case:c.id,role:state.role,mode,question:q,refs:[...refs],by:myName()}];
 const summary=ops.length?ops.map(o=>`<div class="refinement-opinion"><strong>${esc(o.who)} · ${esc(o.title)}</strong><p>${esc(o.text)}</p></div>`).join(''):'<p>아직 완료된 부서 회신이 없습니다. 현재 접수 기록과 허용된 자료를 먼저 확인하세요.</p>';
