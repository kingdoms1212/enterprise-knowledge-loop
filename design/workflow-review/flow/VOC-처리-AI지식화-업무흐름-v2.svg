<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1360" viewBox="0 0 1760 1360" role="img" aria-labelledby="title desc">
<title id="title">Enterprise Knowledge Loop — VOC 처리와 AI 지식화 업무 흐름</title>
<desc id="desc">VOC는 단순 처리 또는 일반 처리로 종결합니다. 처리 중이거나 완료된 VOC에서 AI 초안을 작성할 수 있습니다. 결과 검증과 공식 근거·공유 범위 확인 후 독립 결재를 거쳐 게시·배포하며 다음 VOC에서 재사용합니다. 범위 확대에는 소유 측과 정책 검토가 추가됩니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#91a7ad"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#148467"/></marker></defs>
<rect width="1760" height="1360" fill="#f5f8f8"/>
<g font-family="Malgun Gothic, 맑은 고딕, Arial, sans-serif">
<text x="72" y="57" font-size="17" fill="#087b5a" font-weight="700" text-anchor="start">ENTERPRISE KNOWLEDGE LOOP</text>
<text x="72" y="112" font-size="39" fill="#173c49" font-weight="700" text-anchor="start">VOC 처리와 AI 지식화는 별도로 진행합니다</text>
<text x="72" y="153" font-size="21" fill="#637e88" font-weight="400" text-anchor="start">VOC는 해결하고 종결합니다. 재사용할 경험은 처리 중에도, 완료 후에도 지식으로 남길 수 있습니다.</text>
<text x="1688" y="57" font-size="15" fill="#78909a" font-weight="400" text-anchor="end">디자인 시안 업무 흐름 · v2</text>
<rect x="56" y="192" width="1648" height="360" rx="18" fill="#edf5f2" stroke="#dbe8e1"/>
<text x="84" y="238" font-size="23" fill="#087b5a" font-weight="700" text-anchor="start">01  VOC 처리</text>
<text x="1668" y="238" font-size="18" fill="#5a7f70" font-weight="400" text-anchor="end">기본 업무 · 지식화 없이도 종결 가능</text>
<rect x="88" y="326" width="228" height="136" rx="14" fill="#ffffff" stroke="#dce6e7"/>
<text x="112" y="368" font-size="24" fill="#233f4b" font-weight="700" text-anchor="start">VOC 수신·정제</text>
<text x="112" y="406" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">기존 접수 기록 반입</text>
<text x="112" y="435" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">정제문·AI 분석 확인</text>
<rect x="362" y="326" width="228" height="136" rx="14" fill="#ffffff" stroke="#dce6e7"/>
<text x="386" y="368" font-size="24" fill="#233f4b" font-weight="700" text-anchor="start">담당 지정</text>
<text x="386" y="406" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">책임 부서 확정</text>
<text x="386" y="435" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">처리 기록(Case) 생성</text>
<rect x="638" y="272" width="542" height="248" rx="14" fill="#ffffff" stroke="#bfd7cb"/>
<text x="663" y="310" font-size="22" fill="#233f4b" font-weight="700" text-anchor="start">VOC 처리 방식</text>
<rect x="660" y="330" width="498" height="67" rx="8" fill="#f4f8f7" stroke="#edf2ef"/>
<text x="679" y="358" font-size="20" fill="#285949" font-weight="700" text-anchor="start">단순 처리</text>
<text x="805" y="358" font-size="18" fill="#59736b" font-weight="400" text-anchor="start">기존 게시 지식 적용</text>
<text x="805" y="384" font-size="16" fill="#789087" font-weight="400" text-anchor="start">선택한 지식 버전·적용 사유 기록</text>
<rect x="660" y="408" width="498" height="90" rx="8" fill="#f4f8f7" stroke="#edf2ef"/>
<text x="679" y="439" font-size="20" fill="#285949" font-weight="700" text-anchor="start">일반 처리</text>
<text x="805" y="439" font-size="18" fill="#59736b" font-weight="400" text-anchor="start">조사·협업 → 조치·결과 기록</text>
<text x="805" y="471" font-size="16" fill="#789087" font-weight="400" text-anchor="start">AI 검색·의견 비교로 담당자 판단 지원</text>
<rect x="1262" y="326" width="358" height="136" rx="14" fill="#ffffff" stroke="#b9dbce"/>
<text x="1286" y="368" font-size="24" fill="#087b5a" font-weight="700" text-anchor="start">VOC 처리 완료</text>
<text x="1286" y="406" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">담당 부서가 결과를 남기고 종결</text>
<text x="1286" y="435" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">지식화 여부와 관계없이 완료</text>
<path d="M316 394 H362" fill="none" stroke="#91a7ad" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M590 394 H638" fill="none" stroke="#91a7ad" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1180 394 H1262" fill="none" stroke="#91a7ad" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="56" y="700" width="1648" height="446" rx="18" fill="#f0f4f8" stroke="#dce5ed"/>
<path d="M908 520 V592 H258 V784" fill="none" stroke="#148467" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#green)"/>
<path d="M1441 462 V644 H358 V784" fill="none" stroke="#148467" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#green)"/>
<rect x="494" y="564" width="300" height="34" rx="5" fill="#f5f8f8" stroke="#f5f8f8"/>
<text x="644.0" y="588" font-size="18" fill="#087b5a" font-weight="600" text-anchor="middle">처리 중에도 AI 지식화 시작</text>
<rect x="956" y="616" width="320" height="34" rx="5" fill="#f5f8f8" stroke="#f5f8f8"/>
<text x="1116.0" y="640" font-size="18" fill="#087b5a" font-weight="600" text-anchor="middle">완료 후에도 AI 지식화 시작</text>
<text x="84" y="747" font-size="23" fill="#2e536b" font-weight="700" text-anchor="start">02  지식화</text>
<text x="1668" y="747" font-size="18" fill="#647f91" font-weight="400" text-anchor="end">선택 작업 · 초안 작성은 지금, 공식 공유는 검증·결재 후</text>
<rect x="100" y="784" width="300" height="174" rx="14" fill="#ffffff" stroke="#b9dbce"/>
<text x="124" y="826" font-size="24" fill="#087b5a" font-weight="700" text-anchor="start">AI 지식 초안</text>
<text x="124" y="864" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">현재 문의·처리 기록으로 작성</text>
<text x="124" y="893" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">사람이 수정 · 최신 기록 반영</text>
<text x="124" y="922" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">미검증 초안은 공식 사용 불가</text>
<rect x="466" y="784" width="338" height="174" rx="14" fill="#ffffff" stroke="#dce6e7"/>
<text x="490" y="826" font-size="24" fill="#233f4b" font-weight="700" text-anchor="start">결과 검증·제출 준비</text>
<text x="490" y="864" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">저장된 결과·증거·조건 확인</text>
<text x="490" y="893" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">공식 근거·공유 부서 선택</text>
<text x="490" y="922" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">확인된 초안을 검토 제출</text>
<rect x="870" y="784" width="310" height="174" rx="14" fill="#ffffff" stroke="#dce6e7"/>
<text x="894" y="826" font-size="24" fill="#233f4b" font-weight="700" text-anchor="start">독립 결재</text>
<text x="894" y="864" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">기본 범위: 승인자 1명</text>
<text x="894" y="893" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">제출자와 다른 사람이 확인</text>
<text x="894" y="922" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">내용·근거·공유 범위 승인</text>
<rect x="1262" y="784" width="358" height="174" rx="14" fill="#ffffff" stroke="#b9dbce"/>
<text x="1286" y="826" font-size="24" fill="#087b5a" font-weight="700" text-anchor="start">자동 게시·공유</text>
<text x="1286" y="864" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">게시 → 색인 준비 → 부서 전달</text>
<text x="1286" y="893" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">현재 권한 범위에서 열람</text>
<text x="1286" y="922" font-size="18" fill="#647c86" font-weight="400" text-anchor="start">다음 VOC에서 검색·재사용</text>
<path d="M400 871 H466" fill="none" stroke="#91a7ad" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M804 871 H870" fill="none" stroke="#91a7ad" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1180 871 H1262" fill="none" stroke="#91a7ad" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="870" y="1004" width="750" height="108" rx="10" fill="#fffaf0" stroke="#eadfbf"/>
<text x="895" y="1039" font-size="20" fill="#8b6b28" font-weight="700" text-anchor="start">공유 범위를 넓힐 때만 추가 검토</text>
<text x="895" y="1074" font-size="18" fill="#8d7e58" font-weight="400" text-anchor="start">원본 소유 측 확인 + 독립 정책 검토를 병렬로 진행</text>
<text x="895" y="1097" font-size="15" fill="#95866a" font-weight="400" text-anchor="start">두 검토가 끝나면 최종 결재 · 원문 접근권은 별도 유지</text>
<path d="M1024 1004 V958" fill="none" stroke="#91a7ad" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<rect x="100" y="1004" width="704" height="108" rx="10" fill="#f8fbfd" stroke="#dde6ed"/>
<text x="124" y="1039" font-size="20" fill="#426579" font-weight="700" text-anchor="start">처리 결과가 바뀌면?</text>
<text x="124" y="1073" font-size="17" fill="#6a8290" font-weight="400" text-anchor="start">작성한 초안은 보존하고, 미게시 지식의 검증·결재를 다시 확인합니다.</text>
<text x="124" y="1098" font-size="15" fill="#7d919c" font-weight="400" text-anchor="start">초안 생성·지식 게시가 VOC를 자동 종결하지 않습니다.</text>
<rect x="56" y="1182" width="530" height="104" rx="10" fill="#fff" stroke="#e1e9e9"/>
<text x="79" y="1219" font-size="21" fill="#2f555e" font-weight="700" text-anchor="start">VOC 상태와 지식 상태를 분리</text>
<text x="79" y="1256" font-size="16" fill="#778d96" font-weight="400" text-anchor="start">처리 중 / 완료  ×  초안 / 검증 / 결재 / 게시</text>
<rect x="615" y="1182" width="530" height="104" rx="10" fill="#fff" stroke="#e1e9e9"/>
<text x="638" y="1219" font-size="21" fill="#2f555e" font-weight="700" text-anchor="start">사람이 판단하고 승인</text>
<text x="638" y="1256" font-size="16" fill="#778d96" font-weight="400" text-anchor="start">AI는 제안 · 실제 조치와 공식 공유는 사람이 확정</text>
<rect x="1174" y="1182" width="530" height="104" rx="10" fill="#fff" stroke="#e1e9e9"/>
<text x="1197" y="1219" font-size="21" fill="#2f555e" font-weight="700" text-anchor="start">권한 범위 안에서 재사용</text>
<text x="1197" y="1256" font-size="16" fill="#778d96" font-weight="400" text-anchor="start">문서·지식 RAG와 현재 소속 ACL을 함께 적용</text>
<text x="72" y="1322" font-size="15" fill="#82959b" font-weight="400" text-anchor="start">현재 HTML 시안의 업무 구조 설명 · 실제 AI·서버 실행을 의미하지 않음</text>
<text x="1688" y="1322" font-size="15" fill="#82959b" font-weight="400" text-anchor="end">2026.10.19</text>
</g></svg>