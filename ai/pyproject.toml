[project]
name = "ekl-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0",
  "pydantic==2.14.4",
  "pypdf==6.21.4",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.2.0"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
